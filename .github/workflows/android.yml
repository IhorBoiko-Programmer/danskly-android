name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publishes build outputs (ci-tests / ci-apk branches) and GitHub releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, screenshots, 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + UI tests (Robolectric), screenshots, coverage
        run: ./gradlew --continue --stacktrace testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug
      - name: Enforce 100% line coverage
        run: ./gradlew koverVerifyDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/build/reports/kover
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots
      - name: Publish screenshots and reports to the ci-tests branch
        if: always() && github.event_name != 'pull_request'
        run: scripts/publish-ci-output.sh tests app/screenshots app/build/test-results app/build/reports/kover/reportDebug.xml

  build:
    name: APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      DANSKLY_AI_URL: ${{ vars.DANSKLY_AI_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare upload key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release build will be signed with the upload key."
          else
            echo "No upload key in secrets: the release build is signed with the debug key (fine for testing, not for Google Play)."
          fi
      - name: AI server address (from the Cloudflare account when not set as a variable)
        run: |
          if [ -z "$DANSKLY_AI_URL" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || true
            if [ -n "$sub" ]; then echo "DANSKLY_AI_URL=https://danskly.$sub.workers.dev" >> "$GITHUB_ENV"; fi
          fi
          echo "AI server: ${DANSKLY_AI_URL:-(from Cloudflare, see next steps)}"
      - name: Build (the APK for direct download announces new versions; the Play bundle does not)
        run: |
          echo "Built-in AI server: ${DANSKLY_AI_URL:-none}"
          DANSKLY_SELF_UPDATE=true ./gradlew --stacktrace assembleDebug assembleRelease
          ./gradlew --stacktrace bundleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: danskly-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: danskly-aab
          path: app/build/outputs/bundle/release/*.aab
      - name: Publish the APK and App Bundle to the ci-apk branch
        if: github.event_name != 'pull_request'
        run: scripts/publish-ci-output.sh apk app/build/outputs/apk/debug app/build/outputs/apk/release app/build/outputs/bundle/release

  deploy:
    name: Release the APK and deploy the server
    needs: [test, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCODE_KEYS: ${{ secrets.OPENCODE_KEYS }}
      ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
      SIGNED: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      APP_URL: https://github.com/${{ github.repository }}/releases/latest/download/Danskly.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: danskly-apk
          path: apk
      - name: Publish the APK as the latest GitHub release
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::notice::No upload key in secrets, so no public release (a debug-signed APK could not be updated later)."
            exit 0
          fi
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp apk/release/app-release.apk Danskly.apk
          gh release create "v$name-${{ github.run_number }}" Danskly.apk \
            --title "Danskly $name (${{ github.run_number }})" \
            --notes "Автоматична збірка з коміту ${{ github.sha }}. Завантаж Danskly.apk і встанови поверх старої версії." \
            --latest
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the server (web app, content, version info)
        run: node server/build.mjs
      - name: Deploy to Cloudflare
        working-directory: server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set yet, so the server was not deployed."
            exit 0
          fi
          npx --yes wrangler@4 deploy
          # Keys live only in Cloudflare's encrypted secrets; GitHub passes them through without printing them.
          if [ -n "$OPENCODE_KEYS" ]; then printf '%s' "$OPENCODE_KEYS" | npx --yes wrangler@4 secret put OPENCODE_KEYS; fi
          if [ -n "$ACCESS_CODE" ]; then printf '%s' "$ACCESS_CODE" | npx --yes wrangler@4 secret put ACCESS_CODE; fi
      - name: Smoke test the live server
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          base="https://danskly.$sub.workers.dev"
          sleep 5
          echo "Health:"; curl -sS "$base/api/health"; echo
          echo "Content manifest:"; curl -sS "$base/content/manifest.json"; echo
          echo "AI answer:"
          curl -sS -m 60 -X POST "$base/api/ai" -H "content-type: application/json" -H "x-access-code: $ACCESS_CODE" \
            -d '{"messages":[{"role":"user","content":"Svar kun med ét dansk ord: hej"}],"stream":false}' -D - | grep -iE '^x-danskly-model|^HTTP|"text"|"error"' || true


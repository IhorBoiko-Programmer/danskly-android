name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, screenshots, 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + UI tests (Robolectric), screenshots, coverage
        run: ./gradlew --stacktrace recordRoborazziDebug koverXmlReportDebug koverHtmlReportDebug
      - name: Enforce 100% line coverage
        run: ./gradlew koverVerifyDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/build/reports/kover
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshots

  build:
    name: APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      DANSKLY_AI_URL: ${{ vars.DANSKLY_AI_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare upload key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release build will be signed with the upload key."
          else
            echo "No upload key in secrets: the release build is signed with the debug key (fine for testing, not for Google Play)."
          fi
      - name: Build
        run: ./gradlew --stacktrace assembleDebug assembleRelease bundleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: danskly-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: danskly-aab
          path: app/build/outputs/bundle/release/*.aab

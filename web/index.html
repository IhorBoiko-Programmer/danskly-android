<style>
:root{--bg:#f2f2f7;--glass:rgba(255,255,255,.66);--ink:#1c1c1e;--muted:#6c6c70;--line:rgba(60,60,67,.16);--red:#c8102e;--ok:#248a3d;--bad:#d70015;--b1:#ffd9de;--b2:#d2e5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--glass:rgba(44,44,46,.62);--ink:#f5f5f7;--muted:#98989f;--line:rgba(235,235,245,.16);--red:#ff6b81;--ok:#30d158;--bad:#ff6961;--b1:#4a1420;--b2:#10284a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--glass:rgba(44,44,46,.62);--ink:#f5f5f7;--muted:#98989f;--line:rgba(235,235,245,.16);--red:#ff6b81;--ok:#30d158;--bad:#ff6961;--b1:#4a1420;--b2:#10284a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;line-height:1.45;background:radial-gradient(circle at 12% 0%,var(--b1),transparent 45%),radial-gradient(circle at 100% 30%,var(--b2),transparent 50%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;height:48px;padding:0 8px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line)}
#ttl{text-align:center;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{justify-self:start;background:none;border:0;color:var(--red);font:inherit;font-size:1.05rem;padding:8px;cursor:pointer}
#back[hidden]{display:block;visibility:hidden}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.large{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;margin:10px 2px 4px}
.large span{color:var(--red)}
.sub{color:var(--muted);margin:0 2px 16px}.sub.c{text-align:center}
.list{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--line)}
.ic{font-style:normal;width:40px;height:40px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:1.3rem;flex:none}
.big .item{padding:16px}.big .ic{width:52px;height:52px;border-radius:14px;font-size:1.6rem}.big .tx b{font-size:1.12rem}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}.tx b{font-weight:600}.tx small{color:var(--muted)}
.item em{font-style:normal;color:var(--muted);font-size:1.5rem}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.two{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.again{color:var(--red)}
.btn.wide{width:100%;margin-bottom:12px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--red);font:inherit;cursor:pointer;padding:6px 0}
.wl{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}.wl span{color:var(--muted);text-align:right}.wl.done b{color:var(--ok)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:24px;padding:32px 20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;font:inherit;color:inherit;cursor:pointer;margin-bottom:12px}
.card .da{font-size:2.3rem;font-weight:700;letter-spacing:-.02em}.card .uk{font-size:1.6rem;font-weight:600}.card .hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.exbox{text-align:center;margin-bottom:12px;min-height:44px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{font-size:1.6rem;font-weight:700;margin:6px 2px 14px}
.opts{display:grid;gap:8px;margin-bottom:12px}.opts .btn{text-align:left}
.opts .btn.right{border-color:var(--ok);color:var(--ok)}.opts .btn.wrong{border-color:var(--bad);color:var(--bad)}
.card2,details{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card2 h3{margin:0 0 4px;font-size:1.05rem}.card2 p{margin:0 0 10px;color:var(--muted)}
.ex{display:flex;flex-direction:column;padding:8px 0 8px 12px;border-left:3px solid var(--red);margin-bottom:6px}.ex span{color:var(--muted);font-size:.92rem}
mark{background:none;color:var(--red);font-weight:700}
summary{font-weight:600;cursor:pointer}
details>*:not(summary){margin-top:10px}
.note{background:var(--glass);border-left:3px solid var(--red);padding:10px 14px;margin-bottom:12px;border-radius:0 12px 12px 0}
textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;resize:vertical;margin-bottom:12px}
.pre{white-space:pre-wrap}.out{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.out:empty{display:none}
#log{display:grid;gap:8px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:18px;white-space:pre-wrap;max-width:88%}
.msg.user{background:var(--red);color:#fff;justify-self:end}.msg.assistant{background:var(--glass);border:1px solid var(--line)}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(200,16,46,.12);color:var(--red);display:grid;place-items:center;cursor:pointer;padding:0}
.spk.big{width:60px;height:60px}.spk.big svg{width:30px;height:30px}
.spk:active,.lt:active{transform:scale(.94)}
.wl{align-items:center}.wl span{margin-left:auto}
.ex{flex-direction:row;align-items:center;gap:10px}.ex>div{flex:1;display:flex;flex-direction:column;min-width:0}
.exbox .spk{display:inline-grid;vertical-align:middle;width:30px;height:30px;margin-left:6px}
.cardbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}

const GR=[{"t":"Іменники","ic":"🏠","items":[{"t":"Рід: en чи et","p":"Іменник має спільний рід (en) або середній (et). Приблизно три слова з чотирьох — en, тому вчи слово відразу з артиклем.","ex":["*en* bog|книга","*et* hus|будинок","*en* kvinde, *et* barn|жінка, дитина"]},{"t":"Означена форма","p":"Означений артикль додається в кінець слова: en → -en, et → -et. Якщо слово закінчується на -e, додається лише -n або -t.","ex":["en bog → bog*en*|книга → ця книга","et hus → hus*et*|будинок → цей будинок","en pige → pige*n*|дівчина → ця дівчина"]},{"t":"Множина","p":"Три основні закінчення: -er, -e або без закінчення. Часто змінюється голосна, тому вчи множину разом зі словом.","ex":["en dag → dag*e*|день → дні","en bog → b*ø*ger|книга → книги","et barn → b*ø*rn|дитина → діти","en lærer → lærer*e*|вчитель → вчителі"]},{"t":"Присвійний -s","p":"Приналежність виражається додаванням -s, без апострофа.","ex":["Anne*s* bil|машина Анни","min vens hus|будинок мого друга"]},{"t":"Неправильна множина","p":"Частина слів змінює голосну або має особливу форму. Їх варто вивчити окремо.","ex":["et barn → *børn*|дитина → діти","en mand → *mænd*|чоловік → чоловіки","en fod → *fødder*|стопа → стопи","et øje → *øjne*|око → очі","en sko → *sko*|черевик → черевики"]},{"t":"Складні слова","p":"Данська легко з’єднує слова в одне. Рід і множину визначає остання частина. Між частинами часто з’являється -s- або -e-.","ex":["et køkken + et bord → et *køkkenbord*|кухонний стіл","et arbejde + en tid → en *arbejdstid*|робочий час","en skole + en lærer → en *skolelærer*|шкільний учитель"]},{"t":"Незлічувані іменники","p":"Речовини й абстрактні поняття вживаються без en/et. Для «трохи» кажуть noget, для «багато» meget. Penge (гроші) завжди в множині.","ex":["Jeg drikker *vand*.|Я п’ю воду.","Kan jeg få *noget* mælk?|Можна трохи молока?","Har du *mange penge*?|У тебе багато грошей?"]},{"t":"Означена множина: -ne, -ene","p":"«Ці книги, ці будинки»: до множини додається -ne (якщо множина закінчується на -e) або -ene.","ex":["bøger → bøger*ne*|книги → ці книги","huse → huse*ne*|будинки → ці будинки","børn → børn*ene*|діти → ці діти"]},{"t":"Прикметник перед іменником: den, det, de","p":"Коли перед іменником стоїть прикметник, артикль пишеться окремо: den (en), det (et), de (множина). Закінчення -en/-et тоді не додається.","ex":["*den* store bog|ця велика книга","*det* nye hus|цей новий будинок","*de* gamle biler|ці старі машини"]},{"t":"Суфікси -ing, -hed, -else, -skab","p":"Іменники на -ing, -hed і -else зазвичай мають рід en, а на -skab найчастіше et. Це допомагає вгадати артикль.","ex":["en forklar*ing*|пояснення","en mulig*hed*|можливість","en ople*velse*|враження, досвід","et ven*skab*|дружба"]}]},{"t":"Займенники","ic":"👤","items":[{"t":"Особові","p":"Підмет: jeg, du, han, hun, den/det, vi, I, de. Додаток: mig, dig, ham, hende, den/det, os, jer, dem.","ex":["*Jeg* kender *dig*.|Я знаю тебе.","*Hun* hjælper *mig*.|Вона допомагає мені.","*Vi* ser *dem* i morgen.|Ми побачимо їх завтра."]},{"t":"Присвійні","p":"min/mit/mine, din/dit/dine залежать від роду й числа речі. Hans, hendes, vores, jeres, deres не змінюються.","ex":["*min* bil, *mit* hus, *mine* børn|моя машина, мій дім, мої діти","*hendes* bror|її брат","*vores* lejlighed|наша квартира"]},{"t":"Свій: sin/sit/sine","p":"Якщо власник — підмет цього ж речення, вживай sin/sit/sine. Якщо це інша особа — hans/hendes.","ex":["Han elsker *sin* kone.|Він кохає свою дружину.","Han ser *hans* bror.|Він бачить його (чужого) брата."]},{"t":"Питальні й вказівні","p":"hvem (хто), hvad (що), hvilken/hvilket/hvilke (який), denne/dette/disse (цей).","ex":["*Hvem* er det?|Хто це?","*Hvilket* hus bor du i?|У якому будинку ти живеш?"]},{"t":"Зворотний sig","p":"sig вживається, коли дія повертається на підмет (han, hun, de). Для jeg, du, vi: mig, dig, os.","ex":["Han vasker *sig*.|Він миється.","Jeg glæder *mig*.|Я з нетерпінням чекаю."]},{"t":"Відносні som і der","p":"som вводить означальне речення й може бути підметом або додатком. der вживається лише як підмет. Якщо som є додатком, його часто пропускають.","ex":["Manden, *som* bor her, er læge.|Чоловік, який тут живе, — лікар.","Kvinden, *der* ringede, hedder Anne.|Жінку, яка телефонувала, звати Анна.","Bogen, (som) jeg læser, er god.|Книга, яку я читаю, добра."]},{"t":"Неозначені займенники","p":"nogen (хтось, якісь), noget (щось), nogle (кілька), ingen (ніхто, жоден), intet (ніщо), alle (усі), alt (усе), hver/hvert (кожен).","ex":["Er der *nogen* hjemme?|Є хтось удома?","Jeg har *noget* at sige.|Мені є що сказати.","*Nogle* venner kommer i aften.|Увечері прийдуть кілька друзів.","Der er *ingen* mælk.|Молока немає.","*Hver* dag lærer jeg ti ord.|Щодня я вчу десять слів."]},{"t":"Безособове man","p":"man означає «люди загалом» і вживається з дієсловом як він/вона. Часто перекладається безособовою формою.","ex":["*Man* må ikke ryge her.|Тут не можна палити.","Hvordan siger *man* det på dansk?|Як це кажуть данською?"]},{"t":"Формальні det і der","p":"det стоїть на місці підмета в реченнях про погоду, час, оцінки. der er означає «є, існує».","ex":["*Det* regner.|Іде дощ.","*Det* er svært at lære dansk.|Вивчати данську важко.","*Der er* en bank på hjørnet.|На розі є банк.","*Der er* mange mennesker i dag.|Сьогодні багато людей."]},{"t":"hinanden — один одного","p":"Коли дія взаємна, кажемо hinanden.","ex":["De kender *hinanden*.|Вони знають одне одного.","Vi hjælper *hinanden*.|Ми допомагаємо одне одному."]},{"t":"selv — сам, навіть","p":"selv після дієслова означає «сам», а на початку перед іменником — «навіть».","ex":["Jeg har *selv* lavet kagen.|Я сам спік торт.","*Selv* børn kan forstå det.|Навіть діти можуть це зрозуміти."]},{"t":"begge, hver, hele","p":"begge — обидва; hver/hvert — кожен (en/et); hele — увесь, цілий.","ex":["*Begge* mine børn går i skole.|Обоє моїх дітей ходять до школи.","*Hver* dag cykler jeg på arbejde.|Щодня я їжджу на роботу велосипедом.","Jeg har ventet *hele* dagen.|Я чекав увесь день."]}]},{"t":"Дієслова","ic":"🏃","items":[{"t":"Теперішній час","p":"Не змінюється за особами: до кореня додається -r або -er.","ex":["at bo → jeg bo*r*|жити → я живу","at købe → vi købe*r*|купувати → ми купуємо","at spise → de spise*r*|їсти → вони їдять"]},{"t":"Минулий час","p":"Правильні дієслова: -ede або -te. Неправильні треба вчити напам’ять.","ex":["Jeg bo*ede* i Odense.|Я жив в Оденсе.","Hun køb*te* en bog.|Вона купила книгу.","Vi *var* i Aarhus.|Ми були в Орхусі."]},{"t":"Перфект: har/er + дієприкметник","p":"Минуле, пов’язане з теперішнім. Зазвичай har, а для руху й зміни стану — er.","ex":["Jeg *har boet* her i to år.|Я живу тут уже два роки.","Han *er kommet* hjem.|Він прийшов додому.","Har du *spist*?|Ти вже поїв?"]},{"t":"Неправильні дієслова","p":"Форми: інфінітив – минулий – дієприкметник.","ex":["at være – var – været|бути","at have – havde – haft|мати","at gå – gik – gået|йти","at se – så – set|бачити","at tage – tog – taget|брати","at give – gav – givet|давати","at skrive – skrev – skrevet|писати","at finde – fandt – fundet|знаходити","at sige – sagde – sagt|казати","at drikke – drak – drukket|пити"]},{"t":"Модальні дієслова","p":"kan (вмію, можу), skal (маю), vil (хочу), må (мушу, можна), bør (варто) + інфінітив без at.","ex":["Jeg *kan* tale dansk.|Я вмію говорити данською.","Du *skal* komme kl. 8.|Ти маєш прийти о 8.","Vi *vil* gerne bestille bord.|Ми хочемо замовити столик.","Man *må* ikke ryge her.|Тут не можна палити."]},{"t":"Майбутнє","p":"Часто vil/skal + інфінітив або kommer til at. Для планів досить теперішнього часу з обставиною.","ex":["Jeg *rejser* i morgen.|Я їду завтра.","Det *kommer til at* regne.|Піде дощ.","Hun *vil* blive læge.|Вона стане лікаркою."]},{"t":"Наказовий спосіб","p":"Корінь дієслова без закінчення. Для ввічливості додай tak.","ex":["*Kom* herind!|Заходь сюди!","*Vent* et øjeblik, tak.|Зачекайте хвилинку, будь ласка.","*Skriv* til mig.|Напиши мені."]},{"t":"Пасив","p":"Інфінітив + -s або blive + дієприкметник.","ex":["Bogen *læses* af mange.|Книгу читають багато людей.","Huset *blev bygget* i 1990.|Будинок збудували в 1990 році."]},{"t":"Плюсквамперфект","p":"havde/var + дієприкметник. Показує дію, що відбулася раніше за іншу дію в минулому.","ex":["Jeg *havde* allerede *spist*, da han kom.|Я вже поїв, коли він прийшов.","Toget *var kørt*, da vi kom.|Потяг уже поїхав, коли ми прийшли."]},{"t":"Дієслова на -s","p":"Деякі дієслова завжди мають закінчення -s: synes, mødes, ses, findes, lykkes. Вони не мають наказової форми.","ex":["Jeg *synes*, det er en god idé.|Я вважаю, що це гарна ідея.","Vi *ses* i morgen!|Побачимось завтра!","Der *findes* mange muligheder.|Існує багато можливостей."]},{"t":"Зворотні дієслова","p":"Дієслово + займенник: mig, dig, sig, os, jer, sig. Часті: glæde sig, skynde sig, sætte sig, føle sig, interessere sig for.","ex":["Jeg *glæder mig* til ferien.|Я з нетерпінням чекаю відпустки.","Vi *skynder os*.|Ми поспішаємо.","Hun *føler sig* træt.|Вона почувається втомленою.","*Sæt dig* ned!|Сідай!"]},{"t":"Дієслова з часткою","p":"Частка (op, ud, på, af, ind) змінює значення і стоїть після додатка.","ex":["Jeg *står op* kl. 7.|Я встаю о 7.","Hun *tager* jakken *på*.|Вона вдягає куртку.","Jeg kan ikke *finde ud af* det.|Я не можу в цьому розібратися.","*Hold op* med det!|Припини це!"]},{"t":"Дія в процесі","p":"Данська не має окремого тривалого часу. Замість нього: være ved at або sidde/stå/ligge og + дієслово.","ex":["Jeg *er ved at* lave mad.|Я саме готую їжу.","Hun *sidder og* læser.|Вона сидить і читає.","De *står og* venter på bussen.|Вони стоять і чекають автобус."]},{"t":"Звичка й щойно","p":"plejer at — «зазвичай»; har lige — «щойно»; skal til at — «якраз збираюся».","ex":["Jeg *plejer at* cykle på arbejde.|Я зазвичай їжджу на роботу велосипедом.","Jeg *har lige* spist.|Я щойно поїв.","Vi *skal til at* gå.|Ми якраз збираємося йти."]},{"t":"Умовний спосіб","p":"ville + інфінітив: «я б». Нереальна умова: hvis + минулий час, головне речення з ville.","ex":["Jeg *ville* gerne have en kaffe.|Я б хотів каву.","*Hvis* jeg *havde* tid, *ville* jeg rejse.|Якби я мав час, я б подорожував.","*Hvis* jeg *havde vidst* det, *ville* jeg *være kommet*.|Якби я знав, я б прийшов."]},{"t":"Модальні в минулому","p":"Форми минулого часу модальних дієслів: kunne, skulle, ville, måtte, burde.","ex":["Jeg *kunne* ikke komme.|Я не міг прийти.","Du *burde* ringe til lægen.|Тобі варто зателефонувати лікареві.","Vi *skulle* mødes kl. 10.|Ми мали зустрітися о 10."]},{"t":"Інфінітив з at і без at","p":"Після модальних дієслів at не ставиться. Після інших дієслів і виразів потрібне at.","ex":["Jeg *kan* svømme.|Я вмію плавати.","Jeg *prøver at* lære dansk.|Я намагаюся вивчити данську.","Det er sjovt *at* rejse.|Подорожувати весело."]},{"t":"Непряма мова","p":"Після дієслова в минулому часі дієслово в підрядному реченні теж переходить у минулий.","ex":["Han siger, at han *er* træt.|Він каже, що втомлений.","Han sagde, at han *var* træt.|Він сказав, що втомлений."]},{"t":"Дієприкметник на -ende","p":"Утворюється від інфінітива + -nde. Вживається як прикметник або після komme.","ex":["et *smilende* barn|усміхнена дитина","Han kom *løbende*.|Він прибіг."]},{"t":"Як справи: at have det","p":"Стан людини описують через have det.","ex":["Hvordan *har du det*?|Як ти?","Jeg *har det* godt.|У мене все добре.","Hun *har det* ikke så godt.|Їй не дуже добре."]},{"t":"Ще неправильні дієслова","p":"Інфінітив – минулий – дієприкметник.","ex":["at komme – kom – kommet|приходити","at sove – sov – sovet|спати","at sidde – sad – siddet|сидіти","at stå – stod – stået|стояти","at ligge – lå – ligget|лежати","at sætte – satte – sat|ставити","at vælge – valgte – valgt|обирати","at fortælle – fortalte – fortalt|розповідати","at spørge – spurgte – spurgt|питати","at hjælpe – hjalp – hjulpet|допомагати","at vinde – vandt – vundet|вигравати","at vide – vidste – vidst|знати"]},{"t":"Перфект з er: рух і зміна","p":"Дієслова руху й зміни стану (komme, gå, rejse, flytte, blive, dø) часто утворюють перфект з er, а не har.","ex":["Jeg *er flyttet* til Aarhus.|Я переїхав до Орхуса.","Han *er blevet* syg.|Він захворів.","Toget *er kørt*.|Потяг уже поїхав."]},{"t":"Пасив з blive","p":"blive + дієприкметник описує конкретну дію: хто щось зробив, не важливо. Пасив на -s частіше для правил і звичних дій.","ex":["Huset *blev bygget* i 1920.|Будинок збудували в 1920 році.","Han *bliver opereret* i morgen.|Його завтра оперуватимуть.","Butikken *lukkes* kl. 18.|Магазин зачиняється о 18:00."]},{"t":"ligge/lægge, sidde/sætte, stå/stille","p":"Перше дієслово — стан (де щось є), друге — дія (куди щось кладуть). Частий іспитовий підступ.","ex":["Bogen *ligger* på bordet.|Книга лежить на столі.","Jeg *lægger* bogen på bordet.|Я кладу книгу на стіл.","Hun *sidder* på stolen. Han *sætter* sig.|Вона сидить на стільці. Він сідає.","Lampen *står* i hjørnet. Jeg *stiller* den der.|Лампа стоїть у кутку. Я ставлю її туди."]},{"t":"kan lide, har lyst til, har brug for","p":"Сталі вирази: подобається, хочеться, потрібно.","ex":["Jeg *kan godt lide* kaffe.|Я люблю каву.","Jeg *har lyst til* en is.|Мені хочеться морозива.","Jeg *har brug for* hjælp.|Мені потрібна допомога."]},{"t":"skulle: план і обов’язок","p":"skal означає план («збираюся») або обов’язок («мушу»). Після skal дієслово руху часто пропускають.","ex":["Jeg *skal* på arbejde i morgen.|Завтра мені на роботу.","Du *skal* tage medicinen tre gange om dagen.|Ти маєш приймати ліки тричі на день.","Vi *skal* til Spanien i sommerferien.|Влітку ми їдемо до Іспанії."]},{"t":"Дієприкметник як прикметник","p":"Дієприкметник минулого часу може стояти перед іменником, як прикметник.","ex":["en *brækket* arm|зламана рука","et *stjålet* kort|вкрадена картка","de *købte* varer|куплені товари"]}]},{"t":"Прикметники","ic":"🎨","items":[{"t":"Узгодження","p":"en: основна форма; et: +t; множина й означена форма: +e.","ex":["en *stor* by|велике місто","et *stort* hus|великий будинок","*store* byer|великі міста"]},{"t":"Означена форма","p":"den/det/de + прикметник на -e + іменник.","ex":["den *store* by|це велике місто","det *nye* job|нова робота","de *gamle* huse|старі будинки"]},{"t":"Ступені порівняння","p":"Правильні: -ere, -est. Часті неправильні форми варто вивчити.","ex":["billig – billig*ere* – billig*st*|дешевий – дешевший – найдешевший","god – bedre – bedst|добрий – кращий – найкращий","mange – flere – flest|багато – більше – найбільше","lille – mindre – mindst|малий – менший – найменший"]},{"t":"Незмінні прикметники","p":"Прикметники на -e не змінюються. На -sk не отримують -t. На -t не подвоюють t.","ex":["et *moderne* hus|сучасний будинок","*stille* gader|тихі вулиці","et *dansk* firma|данська фірма","et *let* job|легка робота"]},{"t":"lille і små","p":"lille в однині, små у множині. В означеній однині теж lille.","ex":["en *lille* by, et *lille* hus|маленьке місто, маленький будинок","*små* byer|маленькі міста","den *lille* pige|ця маленька дівчинка"]},{"t":"egen, eget, egne","p":"«Власний» узгоджується як прикметник.","ex":["min *egen* bil|моя власна машина","mit *eget* værelse|моя власна кімната","mine *egne* børn|мої власні діти"]},{"t":"Прислівник з прикметника","p":"Щоб сказати «як» роблять дію, прикметник отримує -t.","ex":["Hun taler *godt* dansk.|Вона добре говорить данською.","Han kører *hurtigt*.|Він швидко їздить."]},{"t":"Порівняння: end, som, mere","p":"end — «ніж». lige så … som — «такий самий, як». Для довгих слів — mere/mest.","ex":["Peter er *højere end* Jens.|Петер вищий за Єнса.","Hun er *lige så* gammel *som* jeg.|Вона такого ж віку, як я.","Det er den *mest* populære app.|Це найпопулярніший застосунок."]},{"t":"Прикметник після er","p":"Після er прикметник узгоджується з підметом: -t для et-слів, -e для множини.","ex":["Huset er stor*t*.|Будинок великий.","Bilerne er ny*e*.|Машини нові.","Maden er god.|Їжа смачна."]},{"t":"mange/meget, få/lidt","p":"mange і få — для того, що можна порахувати; meget і lidt — для незлічуваного. penge — множина, тому mange penge.","ex":["*mange* bøger, *få* venner|багато книжок, мало друзів","*meget* vand, *lidt* tid|багато води, мало часу","Hvor *mange* penge?|Скільки грошей?"]}]},{"t":"Прислівники","ic":"🧭","items":[{"t":"Місце й напрямок","p":"Пари прислівників: hjem/hjemme, ind/inde, ud/ude, op/oppe, ned/nede. Перший — рух, другий — перебування.","ex":["Jeg går *hjem*.|Я йду додому.","Jeg er *hjemme*.|Я вдома.","Kom *ind*!|Заходь!","Børnene leger *ude*.|Діти граються надворі."]},{"t":"Позиція коротких прислівників","p":"ikke, aldrig, altid, også, gerne, kun, ofte, allerede стоять там само, де ikke: після дієслова в головному реченні, перед ним у підрядному.","ex":["Jeg drikker *altid* kaffe.|Я завжди п’ю каву.","Jeg ved, at han *altid* drikker kaffe.|Я знаю, що він завжди п’є каву.","Har du *også* en bil?|У тебе теж є машина?"]},{"t":"gerne","p":"gerne означає «охоче». З vil/ville це ввічливе «хотів би».","ex":["Jeg vil *gerne* have en kop te.|Я хотів би чашку чаю.","Jeg spiller *gerne* fodbold.|Я охоче граю у футбол."]},{"t":"Частки jo, nok, vel","p":"Маленькі слова, що додають відтінок: jo — «адже», nok — «мабуть», vel — «же, мабуть» у питаннях.","ex":["Det er *jo* rigtigt.|Це ж правда.","Han kommer *nok* i morgen.|Він, мабуть, прийде завтра.","Du er *vel* ikke syg?|Ти ж не хворий?"]},{"t":"Ще, вже, досі","p":"endnu ikke — «ще не», allerede — «вже», stadig — «досі».","ex":["Jeg er *ikke* færdig *endnu*.|Я ще не закінчив.","Hun er *allerede* gået.|Вона вже пішла.","Han bor *stadig* i Aarhus.|Він досі живе в Орхусі."]},{"t":"altid, ofte, aldrig: де ставити","p":"Прислівники частоти стоять після дієслова в головному реченні і перед дієсловом у підрядному.","ex":["Jeg drikker *altid* kaffe om morgenen.|Я завжди п’ю каву вранці.","Han kommer *aldrig* for sent.|Він ніколи не запізнюється.","…, fordi jeg *sjældent* har tid.|…, бо в мене рідко є час."]},{"t":"også і heller ikke","p":"Після заперечення замість også кажемо heller ikke («теж не»).","ex":["Jeg kan *også* lide det.|Мені це теж подобається.","Jeg kan *heller ikke* lide det.|Мені це теж не подобається.","Han kommer ikke, og det gør jeg *heller ikke*.|Він не прийде, і я теж."]}]},{"t":"Прийменники","ic":"📍","items":[{"t":"Місце","p":"i: всередині міста чи країни; på: установи, острови, поверхні; hos: у людини вдома; ved: біля.","ex":["Jeg bor *i* København.|Я живу в Копенгагені.","Hun er *på* arbejde.|Вона на роботі.","Vi er *hos* Anne.|Ми в Анни.","Bordet står *ved* vinduet.|Стіл стоїть біля вікна."]},{"t":"Напрямок","p":"til: рух до; fra: звідки; hjem: додому (без til).","ex":["Jeg rejser *til* Danmark.|Я їду до Данії.","Han kommer *fra* Ukraine.|Він родом з України.","Vi går *hjem*.|Ми йдемо додому."]},{"t":"Час","p":"kl.: година; om: через або у часі; i: протягом; på: наступного дня тижня; før/efter: до/після.","ex":["Mødet er *kl.* 14.|Зустріч о 14:00.","Jeg kommer *om* en time.|Я прийду за годину.","Jeg har boet her *i* to år.|Я живу тут два роки.","Vi ses *på* mandag.|Побачимось у понеділок."]},{"t":"Інші частотні","p":"med (з), uden (без), om (про), for (для), af (від, з), mod (проти), mellem (між).","ex":["Jeg taler *med* min chef.|Я розмовляю з керівником.","kaffe *uden* sukker|кава без цукру","Vi taler *om* arbejde.|Ми говоримо про роботу.","Det er godt *for* dig.|Це добре для тебе."]},{"t":"Час: for … siden, på, i","p":"for … siden — «тому»; på + період — «за»; i + період — «протягом».","ex":["Jeg kom til Danmark *for* to år *siden*.|Я приїхав до Данії два роки тому.","Jeg lærte det *på* en uge.|Я вивчив це за тиждень.","Jeg boede der *i* fem år.|Я жив там п’ять років."]},{"t":"Сталі прийменники після дієслів","p":"Деякі дієслова завжди вимагають свого прийменника. Вчи їх разом.","ex":["Jeg *tænker på* dig.|Я думаю про тебе.","Vi *venter på* bussen.|Ми чекаємо автобус.","Jeg *glæder mig til* weekenden.|Я чекаю вихідних.","Hun er *bange for* hunde.|Вона боїться собак.","Jeg er *interesseret i* jobbet.|Мене цікавить ця робота."]},{"t":"Транспорт і місця: med, på, i","p":"med — транспорт; på — на роботі, в лікарні, на пошті; i — у школі, в місті, в магазині.","ex":["Jeg tager *med* bussen.|Я їду автобусом.","Vi går *til* fods.|Ми йдемо пішки.","Jeg er *på* arbejde.|Я на роботі.","Børnene er *i* skole.|Діти в школі."]},{"t":"til, hos, for у сталих фразах","p":"til — куди (до кого), hos — у кого, for — за що.","ex":["Jeg skal *til* lægen.|Мені треба до лікаря.","Jeg bor *hos* min søster.|Я живу в сестри.","Tak *for* hjælpen.|Дякую за допомогу."]}]},{"t":"Сполучники","ic":"🔗","items":[{"t":"Сурядні: og, men, eller, for, så","p":"Порядок слів після них не змінюється.","ex":["Jeg er træt, *men* jeg arbejder.|Я втомлений, але працюю.","Vil du have te *eller* kaffe?|Хочеш чай чи каву?"]},{"t":"Підрядні: at, fordi, hvis, når, selvom","p":"У підрядному реченні порядок такий: підмет, ikke чи прислівник, дієслово.","ex":["Jeg tror, *at* han *ikke* kommer.|Думаю, що він не прийде.","Jeg bliver hjemme, *fordi* jeg er syg.|Я лишаюся вдома, бо хворий.","*Hvis* det regner, bliver vi hjemme.|Якщо піде дощ, залишимося вдома.","*Selvom* jeg er træt, arbejder jeg.|Хоч я втомлений, я працюю."]},{"t":"Зв’язки для письма","p":"Слова, які роблять текст логічним: for det første, for det andet, desuden, til gengæld, derfor, endelig.","ex":["*For det første* sparer man tid.|По-перше, економиться час.","*Desuden* er det billigere.|До того ж це дешевше.","*Til gengæld* er det ensomt.|Натомість це самотньо.","*Derfor* mener jeg, at …|Тому я вважаю, що …"]},{"t":"da чи når","p":"da — одна подія в минулому. når — повторювана дія або майбутнє.","ex":["*Da* jeg var barn, boede jeg i Kyiv.|Коли я був дитиною, я жив у Києві.","*Når* det regner, tager jeg bussen.|Коли йде дощ, я їду автобусом."]},{"t":"hvis чи om","p":"hvis — «якщо» (умова). om — «чи» (непряме питання).","ex":["*Hvis* du har tid, kan vi mødes.|Якщо маєш час, можемо зустрітися.","Jeg ved ikke, *om* han kommer.|Я не знаю, чи він прийде."]},{"t":"fordi чи for","p":"Обидва означають «бо». Після fordi — порядок підрядного речення, після for — головного.","ex":["Jeg bliver hjemme, *fordi* jeg *ikke har* tid.|Я лишаюся вдома, бо не маю часу.","Jeg bliver hjemme, *for* jeg *har ikke* tid.|Я лишаюся вдома, бо не маю часу."]},{"t":"Парні сполучники","p":"både … og (і … і), enten … eller (або … або), hverken … eller (ні … ні).","ex":["Hun taler *både* dansk *og* engelsk.|Вона говорить і данською, і англійською.","Vi kan *enten* tage toget *eller* bussen.|Ми можемо поїхати або потягом, або автобусом.","Jeg drikker *hverken* kaffe *eller* te.|Я не п’ю ні кави, ні чаю."]},{"t":"Мета: for at","p":"for at + інфінітив означає «щоб».","ex":["Jeg lærer dansk *for at* få et job.|Я вчу данську, щоб отримати роботу."]},{"t":"før, efter at, mens, indtil, siden","p":"Сполучники часу починають підрядне речення.","ex":["Vi spiser, *før* vi går.|Ми поїмо, перш ніж піти.","*Efter at* jeg var kommet hjem, lavede jeg mad.|Після того як я прийшов додому, я приготував їжу.","*Mens* hun læste, sov børnene.|Поки вона читала, діти спали.","*Siden* jeg flyttede til Danmark, har jeg lært meget.|Відколи я переїхав до Данії, я багато чого навчився."]},{"t":"så, derfor, selvom","p":"så — тому (без інверсії); derfor — тому (з інверсією: дієслово одразу після derfor); selvom — хоча.","ex":["Jeg er træt, *så* jeg går i seng.|Я втомився, тому йду спати.","Jeg er træt. *Derfor går* jeg i seng.|Я втомився. Тому я йду спати.","*Selvom* det regner, går vi en tur.|Хоча йде дощ, ми підемо гуляти."]}]},{"t":"Порядок слів","ic":"🧱","items":[{"t":"V2: дієслово на другому місці","p":"У головному реченні дієслово стоїть другим. Якщо на початку обставина, підмет іде після дієслова.","ex":["Jeg *bor* i København.|Я живу в Копенгагені.","I dag *bor* jeg i Odense.|Сьогодні я живу в Оденсе."]},{"t":"Питання","p":"Без питального слова дієслово перше. З hvad, hvor, hvornår, hvorfor, hvordan, hvem: слово, потім дієслово.","ex":["*Bor* du her?|Ти тут живеш?","*Hvornår* åbner banken?|Коли відкривається банк?"]},{"t":"Заперечення ikke","p":"У головному реченні після дієслова, у підрядному перед ним. Aldrig (ніколи) поводиться так само.","ex":["Jeg bor *ikke* her.|Я тут не живу.","Jeg ved, at han *ikke* bor her.|Я знаю, що він тут не живе.","Hun kommer *aldrig* for sent.|Вона ніколи не запізнюється."]},{"t":"Непрямі питання","p":"Після «чи», «де», «коли» в середині речення — порядок підрядного речення: підмет перед дієсловом.","ex":["Ved du, hvor *han bor*?|Знаєш, де він живе?","Jeg spørger, om *hun kommer*.|Я питаю, чи вона прийде."]},{"t":"Підрядне речення на початку","p":"Якщо речення починається з підрядного, далі одразу йде дієслово головного речення.","ex":["Når jeg kommer hjem, *spiser jeg*.|Коли я приходжу додому, я їм.","Hvis det regner, *bliver vi* hjemme.|Якщо піде дощ, ми лишимося вдома."]},{"t":"Займенник-додаток та ikke","p":"Короткий займенник-додаток стоїть перед ikke, звичайний іменник — після.","ex":["Jeg kender *ham ikke*.|Я його не знаю.","Jeg kender *ikke* manden.|Я не знаю цього чоловіка."]},{"t":"Виділення: det er … der/som","p":"Щоб підкреслити частину речення.","ex":["*Det er* Anne, *der* har ringet.|Це Анна телефонувала.","*Det er* i morgen, *at* vi rejser.|Ми їдемо саме завтра."]},{"t":"Схема головного речення","p":"Перше місце – дієслово – підмет (якщо не на першому місці) – ikke чи прислівник – друге дієслово – додаток – місце – час.","ex":["Jeg *har ikke* set filmen i biografen i går.|Я не бачив цей фільм у кіно вчора.","I går *har* jeg *ikke* set filmen.|Учора я не бачив цей фільм."]},{"t":"Інверсія після слова часу чи прислівника","p":"Якщо речення починається не з підмета, дієслово стоїть другим, а підмет іде після нього.","ex":["*I dag regner det*.|Сьогодні йде дощ.","*Om aftenen ser jeg* tv.|Увечері я дивлюся телевізор.","*Desværre kan jeg* ikke komme.|На жаль, я не можу прийти."]},{"t":"ikke у підрядному реченні","p":"У підрядному реченні ikke (і altid, også) стоїть перед дієсловом.","ex":["Jeg ved, at han *ikke kommer*.|Я знаю, що він не прийде.","Jeg bliver hjemme, fordi jeg *ikke har* det godt.|Я лишаюся вдома, бо почуваюся погано.","Hvis du *ikke kan* komme, så ring.|Якщо не зможеш прийти, подзвони."]},{"t":"Модальне дієслово + інфінітив","p":"Після kan, vil, skal, må, bør інфінітив іде без at.","ex":["Jeg *kan* ikke *komme* i morgen.|Я не можу прийти завтра.","*Kan* du *hjælpe* mig?|Можеш мені допомогти?","*Vil* du *have* en kop kaffe?|Хочеш чашку кави?"]}]},{"t":"Числа й час","ic":"🔢","items":[{"t":"Числа 20–100","p":"Данська рахує по-своєму: 50 = halvtreds, 60 = tres, 70 = halvfjerds, 80 = firs, 90 = halvfems.","ex":["tyve, tredive, fyrre|20, 30, 40","halvtreds, tres|50, 60","halvfjerds, firs, halvfems|70, 80, 90","hundrede, tusind|100, 1000"]},{"t":"Година","p":"halv + наступна година: halv tre = 2:30. kvart over = п’ятнадцять після, kvart i = без п’ятнадцяти.","ex":["Klokken er *halv tre*.|Зараз 2:30.","*Kvart over* otte|8:15","*Kvart i* ni|8:45"]},{"t":"Порядкові числівники й дати","p":"1. første, 2. anden, 3. tredje, 4. fjerde. Дата: den 12. december.","ex":["Min fødselsdag er *den 12. december*.|Мій день народження 12 грудня.","Det er *første* gang.|Це перший раз."]},{"t":"Складені числа","p":"Одиниці кажуть перед десятками: 21 — «один і двадцять».","ex":["21 = *enogtyve*|двадцять один","47 = *syvogfyrre*|сорок сім","85 = *femogfirs*|вісімдесят п’ять"]},{"t":"Роки, ціни, телефони","p":"Роки до 2000 — сотнями. Телефон читають парами цифр. Кома в цінах відділяє ере.","ex":["1995 = *nitten femoghalvfems*|1995","2026 = *to tusind seksogtyve*|2026","49,95 kr. = *niogfyrre femoghalvfems*|49,95 крони"]}]},{"t":"Мовлення на іспиті","ic":"💬","items":[{"t":"Висловити думку","p":"Корисні початки для усної частини і листа.","ex":["Jeg *synes*, at det er en god idé.|Я вважаю, що це гарна ідея.","*Efter min mening* er det for dyrt.|На мою думку, це надто дорого.","Jeg *tror ikke*, at han kommer.|Я не думаю, що він прийде."]},{"t":"Згода й незгода","p":"Як погодитися чи заперечити ввічливо.","ex":["Det er jeg *enig* i.|З цим я згоден.","Det er jeg *ikke enig* i.|З цим я не згоден.","Jeg er *delvist enig*, men…|Я частково згоден, але…","Du har *ret*.|Ти маєш рацію."]},{"t":"Порівняти й навести приклад","p":"На іспиті часто просять порівняти Данію й Україну.","ex":["*For eksempel* cykler mange danskere på arbejde.|Наприклад, багато данців їздять на роботу велосипедом.","I Ukraine spiser vi varm mad til frokost, *men i Danmark* spiser man ofte smørrebrød.|В Україні ми їмо гаряче на обід, а в Данії часто їдять бутерброди.","*Til sammenligning* er det billigere i Ukraine.|Для порівняння, в Україні це дешевше."]},{"t":"Ввічливе прохання","p":"Kunne, må, vil gerne роблять прохання м’якшим.","ex":["*Kunne* du hjælpe mig?|Чи не могли б ви мені допомогти?","*Må jeg* låne din pen?|Можна позичити твою ручку?","Jeg *vil gerne* bestille en tid.|Я хотів би записатися на прийом.","*Vil du være sød at* lukke døren?|Будь ласка, зачини двері."]},{"t":"Розповідь про досвід","p":"Минуле: da (один раз у минулому), før (раніше), nu har jeg… (досі).","ex":["*Da* jeg kom til Danmark, kunne jeg ikke tale dansk.|Коли я приїхав до Данії, я не розмовляв данською.","*Før* arbejdede jeg som sygeplejerske i Kyiv.|Раніше я працювала медсестрою в Києві.","*Nu har jeg boet* her i tre år.|Тепер я живу тут уже три роки."]}]},{"t":"Типові помилки","ic":"⚠️","items":[{"t":"vide, kende, kunne","p":"vide — знати факт; kende — знати людину чи місце; kunne — вміти, знати мову.","ex":["Jeg *ved*, hvor han bor.|Я знаю, де він живе.","Jeg *kender* hans søster.|Я знаю його сестру.","Hun *kan* tre sprog.|Вона знає три мови."]},{"t":"spørge чи bede","p":"spørge — запитати; bede om — попросити щось.","ex":["Jeg *spørger* om vej.|Я питаю дорогу.","Hun *spørger*, om jeg vil med.|Вона питає, чи я піду з нею.","Jeg *beder om* hjælp.|Я прошу допомоги.","Må jeg *bede om* regningen?|Можна рахунок?"]},{"t":"lære, undervise, studere","p":"lære — вчити (самому); undervise — викладати; studere — навчатися в університеті.","ex":["Jeg *lærer* dansk på sprogskolen.|Я вчу данську на мовних курсах.","Hun *underviser* i matematik.|Вона викладає математику.","Han *studerer* medicin.|Він вивчає медицину."]},{"t":"tid, gang, time","p":"tid — час загалом; gang — раз; time — година.","ex":["Jeg har ikke *tid*.|У мене немає часу.","Det er tredje *gang*, jeg ringer.|Я дзвоню вже втретє.","Turen tager en *time*.|Поїздка триває годину."]},{"t":"Заперечення в питанні","p":"У питанні ikke стоїть після підмета: Kommer du ikke?","ex":["Kommer du *ikke* i morgen?|Ти не прийдеш завтра?","Hvorfor kommer du *ikke*?|Чому ти не приходиш?"]}]},{"t":"Правопис і кома","ic":"✏️","items":[{"t":"Велика літера","p":"Дні, місяці, мови й національності пишуться з малої. З великої — I (ви, мн.) і ввічливе De.","ex":["på *mandag* i *januar*|у понеділок у січні","Hun taler *dansk*.|Вона говорить данською.","Han er *dansker*.|Він данець.","Kommer *I* i morgen?|Ви прийдете завтра?"]},{"t":"Кома","p":"Після підрядного речення на початку кома обов’язкова. Перед підрядним реченням (at, fordi, hvis, som) кома необов’язкова: можна писати з нею або без неї, але однаково в усьому тексті.","ex":["Jeg tror at det regner. / Jeg tror*,* at det regner.|Я думаю, що йде дощ.","Hvis det regner*,* bliver vi hjemme.|Якщо піде дощ, лишимося вдома."]},{"t":"Присвійний апостроф","p":"Апостроф ставиться лише після імен, що закінчуються на s, x чи z.","ex":["*Lars'* bil|машина Ларса","*Annes* bil|машина Анни"]}]},{"t":"Вимова","ic":"🔊","items":[{"t":"å, ø, æ","p":"Три додаткові літери. å ≈ «о», ø ≈ «ьо», æ ≈ «е» (відкрите).","ex":["å|річка","øl|пиво","vælge|обирати"]},{"t":"Тихі й м’які звуки","p":"Данське r після голосної майже не чути, а d у закінченнях часто м’який (як th в англійському this). Тому слухай більше, ніж читай.","ex":["gade|вулиця","hånd|кисть руки","spiser|їсть"]}]}];

{t:"Скарга",task:"Du har købt en cykel i en butik, men den er gået i stykker. Skriv en klage til butikken, og bed om at få pengene tilbage. (ca. 80 ord)",text:"Kære Cykelbutik,\n\nJeg købte en cykel hos jer den 3. november. Den kostede 2.500 kroner. Desværre gik bremserne i stykker allerede efter en uge, og det er farligt at køre på den.\n\nJeg synes, at det er dårlig service, fordi jeg har betalt for en ny cykel. Jeg vil derfor gerne have pengene tilbage eller en ny cykel. Jeg har kvitteringen, og jeg kan komme forbi i weekenden.\n\nJeg håber at høre fra jer snart.\n\nMed venlig hilsen\nMaria Hansen",tips:"Структура: що купив і коли, у чому проблема, чого хочеш (гроші назад чи заміна), термін, ввічливе завершення. Тон ввічливий, але чіткий."},
{t:"Заява на роботу",task:"Du vil søge et job som lagermedarbejder. Skriv en kort ansøgning, og fortæl om dig selv og hvorfor du passer til jobbet. (ca. 100 ord)",text:"Kære Hr. Jensen,\n\nJeg skriver, fordi jeg gerne vil søge stillingen som lagermedarbejder. Jeg hedder Maria Hansen, og jeg er 32 år. Jeg har boet i Danmark i to år og taler dansk på niveau B1.\n\nI Ukraine arbejdede jeg på et lager i fem år. Jeg er punktlig, flittig og god til at samarbejde. Jeg kan løfte tungt og er vant til at arbejde med computer.\n\nJeg kunne godt tænke mig at komme til en samtale. Jeg kan starte med det samme.\n\nMed venlig hilsen\nMaria Hansen",tips:"Структура: яку посаду, хто ти, досвід, риси характеру, прохання про співбесіду, дата початку. Пиши про факти, а не про загальні слова."},
{t:"Пропозиція",task:"Din sprogskole eller arbejdsplads kan blive bedre. Skriv et forslag til din lærer eller leder, og forklar hvorfor det er en god idé. (ca. 100 ord)",text:"Hej Lars,\n\nJeg har et forslag til vores sprogskole. Jeg synes, at vi skal have en samtaleklub hver fredag efter timen.\n\nFor det første kan vi øve os i at tale dansk uden at være bange for at lave fejl. For det andet lærer vi hinanden bedre at kende, og det gør klassen hyggeligere. Desuden koster det ikke noget, fordi vi kan sidde i kantinen.\n\nJeg tror, at mange har lyst til at deltage. Hvad synes du om idéen?\n\nVenlig hilsen\nMaria",tips:"Структура: твоя ідея, 2–3 аргументи (for det første, for det andet, desuden), запитання до адресата."}
);

const stripThink=s=>String(s).replace(/<think>[\s\S]*?(<\/think>|$)/g,"").replace(/^\s+/,"");
async function apiCall(input,onText,isJson){const messages=typeof input==="string"?[{role:"user",content:input}]:input;let res;
try{res=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-access-code":(S.set&&S.set.code)||""},body:JSON.stringify({messages,stream:!!onText,json:!!isJson,session:aiSid})})}
catch(e){throw{message:"Немає з’єднання з сервером. Перевір інтернет."}}
if(!res.ok){let j={};try{j=await res.json()}catch(e){}throw{code:j.code||("http_"+res.status),message:j.error||("Помилка сервера "+res.status)}}
aiLast=res.headers.get("x-danskly-model")||aiLast;
if(!onText){const j=await res.json();return{text:stripThink(j.text||"")}}
const rd=res.body.getReader(),dec=new TextDecoder();let buf="",text="";
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d||d==="[DONE]")continue;
let o;try{o=JSON.parse(d)}catch(e){continue}
if(o.error){if(!text.trim())throw{message:"Модель не відповіла вчасно. Спробуй ще раз."};continue}
const c=o.choices&&o.choices[0]&&o.choices[0].delta&&o.choices[0].delta.content;if(c){text+=c;onText(stripThink(text))}}}
text=stripThink(text);if(!text.trim())throw{message:"ШІ повернув порожню відповідь. Спробуй ще раз."};return{text}}
function parseJsonLoose(s){s=stripThink(s).replace(/```(?:json)?/gi,"").trim();try{return JSON.parse(s)}catch(e){}
const a=s.search(/[\[{]/),bad={message:"ШІ відповів не у форматі JSON. Спробуй ще раз."};if(a<0)throw bad;const b=s.lastIndexOf(s[a]==="{"?"}":"]");try{return JSON.parse(s.slice(a,b+1))}catch(e){throw bad}}

const POS_HINT={"Інфінітив":"Словникова форма. Після модальних дієслів без at.","Теперішній":"Зараз, регулярно або найближчим часом.","Минулий":"Завершена дія з точним часом (i går, sidste år).","Перфект":"Минуле, важливе зараз, без точного часу.","Плюсквамперфект":"Дія, що сталася до іншої дії в минулому.","Майбутній":"Плани й наміри (vil, skal).","Умовний":"Ввічливо або нереально: «я б…».","Наказовий":"Прохання чи команда."};
function imper(stem){if((stem.match(/[aeiouyæøå]/g)||[]).length<2||!/e$/.test(stem))return stem;let s=stem.slice(0,-1);if(/([bcdfghjklmnpqrstvwxz])\1$/.test(s))s=s.slice(0,-1);return s}

const DAY=864e5,INT=[0,1,3,7,21],GOAL=20;S.due=S.due||{};S.readDone=S.readDone||{};

const EXT=[{k:"mix",ic:"🎲",t:"Мікс",s:"Усього потроху"},{k:"gap",ic:"🧩",t:"Встав слово",s:"Речення з пропуском"},{k:"build",ic:"🧱",t:"Збери речення",s:"Переклад з української з плиток"},{k:"write",ic:"⌨️",t:"Напиши данською",s:"Переклад слова з клавіатури"},{k:"verb",ic:"🏃",t:"Форми дієслів",s:"Теперішній, минулий, перфект"},{k:"noun",ic:"🏠",t:"Рід і множина",s:"en чи et, множина іменників"},{k:"dict",ic:"🎧",t:"Диктант",s:"Послухай і запиши"}];
let EXP=null;
function exPools(){if(EXP)return EXP;const gap=[],sent=[];
GR.forEach(g=>g.items.forEach(r=>r.ex.forEach(e=>{const[d,u]=e.split("|");if(!u||/[→–=\/()…]/.test(d))return;const plain=d.replace(/\*/g,"").trim(),wc=plain.split(/\s+/).length;
if(wc>=3&&wc<=10&&/[.!?]$/.test(plain))sent.push({da:plain,uk:u.trim(),g:g.t});
const m=d.match(/(^|[^\p{L}])\*([^*]+)\*(?!\p{L})/u);
if(m&&wc>=3&&m[2].split(" ").length<=3){const st=m.index+m[1].length;gap.push({q:(d.slice(0,st)+"_____"+d.slice(st+m[2].length+2)).replace(/\*/g,""),ans:m[2],uk:u.trim(),g:g.t,da:plain})}})));
EXP={gap,sent};return EXP}
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:«»"“”]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const uniq=a=>[...new Set(a)];
function genQ(k){const P=exPools();
if(k==="mix")k=rnd(["gap","build","write","verb","noun"].concat(TTS?["dict"]:[]));
if(k==="gap"){const x=rnd(P.gap),lc=x.ans.toLowerCase();let pool=uniq(shuffle(P.gap.filter(y=>y.g===x.g)).map(y=>y.ans)).filter(a=>a.toLowerCase()!==lc);
if(pool.length<3)pool=uniq(pool.concat(shuffle(P.gap).map(y=>y.ans))).filter(a=>a.toLowerCase()!==lc);
return{kind:"choice",tag:"Встав слово",prompt:x.q,sub:x.uk,opts:shuffle([x.ans,...pool.slice(0,3)]),ans:x.ans,say:x.da,full:x.da}}
if(k==="build"){const x=rnd(P.sent),end=x.da.slice(-1),toks=x.da.slice(0,-1).split(/\s+/),low=toks.map(t=>norm(t));
const extra=uniq(shuffle(P.sent.filter(y=>y!==x)).flatMap(y=>norm(y.da).split(" "))).filter(t=>t.length>1&&!low.includes(t)).slice(0,2);
return{kind:"tiles",tag:"Збери речення",prompt:x.uk,sub:"Склади речення данською",tiles:shuffle(toks.concat(extra)),ans:toks.join(" "),end,say:x.da,full:x.da}}
if(k==="write"){const ok=w=>w.da.split(" ").length<=3&&!/[?!]/.test(w.da);let src=ALL.filter(w=>(S.box[w.da]||0)>=1&&ok(w));if(src.length<8)src=ALL.filter(ok);const w=rnd(src);
return{kind:"type",tag:"Напиши данською",prompt:w.uk,sub:w.art?"Іменник: напиши разом з en або et":/^at /.test(w.da)?"Дієслово: напиши з at":"",ans:[label(w)],alt:[w.da.replace(/^at /,"")],say:label(w),w}}
if(k==="verb"){const ks=Object.keys(VB).filter(s=>ALL.some(w=>w.da==="at "+s)&&!/^(kunne|skulle|ville|måtte|burde)$/.test(s)&&!(/s$/.test(s)&&VB[s].split("|")[0]===s)),st=rnd(ks),[pres,past,part,aux]=VB[st].split("|"),
e=st.endsWith("e"),b=e?st.slice(0,-1):st,f1=(e?st:st+"e")+"de",f2=b+"te",f3=b+"et",w=ALL.find(x=>x.da==="at "+st);
const T3=[["Теперішній час",pres,[st,past,b+"er",st+"r"]],["Минулий час",past,[f1,f2,pres,part]]];if(aux!=="har/er")T3.push(["Перфект",aux+" "+part,[(aux==="har"?"er":"har")+" "+part,aux+" "+past,aux+" "+f3]]);
const[nm,ans,dis]=rnd(T3),opts=uniq(dis).filter(o=>o!==ans).slice(0,3);
return{kind:"choice",tag:"Форми дієслів",prompt:`at ${st} → ${nm.toLowerCase()}`,sub:w?w.uk:"",opts:shuffle([ans,...opts]),ans,say:ans,full:`at ${st} – ${pres} – ${past} – ${aux} ${part}`}}
if(k==="noun"){const ns=ALL.filter(w=>w.art&&NB[w.da]);if(Math.random()<.5){const w=rnd(ALL.filter(x=>x.art));return{kind:"choice",tag:"Рід іменника",prompt:w.da,sub:w.uk,opts:["en","et"],ans:w.art,say:label(w),full:label(w)}}
const w=rnd(ns),[sd,pi,pd]=NB[w.da].split("|"),fake=uniq([w.da+"er",w.da.endsWith("e")?w.da+"r":w.da+"e",sd,pd]).filter(x=>x!==pi);
return{kind:"choice",tag:"Множина",prompt:`${label(w)} → множина`,sub:w.uk,opts:shuffle([pi,...shuffle(fake).slice(0,3)]),ans:pi,say:pi,full:`${label(w)} – ${sd} – ${pi} – ${pd}`}}
if(k==="dict"){if(Math.random()<.4){const x=rnd(P.sent.filter(s=>s.da.split(" ").length<=6));return{kind:"type",tag:"Диктант",audio:x.da,sub:"Послухай і запиши речення",ans:[x.da],say:x.da,uk:x.uk}}
const w=rnd(ALL.filter(x=>x.da.split(" ").length<=2&&!/[?!]/.test(x.da)));return{kind:"type",tag:"Диктант",audio:label(w),sub:"Послухай і запиши слово",ans:[label(w)],alt:[w.da.replace(/^at /,"")],say:label(w),uk:w.uk,w}}
return genQ("gap")}
let XS=null;
SCREENS.ex=()=>{view.innerHTML=`<h1 class="large">Завдання</h1><p class="sub">Кожна сесія — 10 вправ</p><div class="list">`+EXT.filter(x=>x.k!=="dict"||TTS).map((x,i)=>item(x.ic,x.t,x.s,"exrun",x.k,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.exrun=k=>{XS={k,i:0,n:10,ok:0,wrong:[],q:genQ(k),done:false,pick:[]};exQ()};
function exQ(){const q=XS.q;XS.done=false;XS.pick=[];
let body="";
if(q.kind==="choice")body=`<div class="q">${esc(q.prompt)}</div>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}<div class="opts">${q.opts.map(o=>`<button class="btn" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
if(q.kind==="tiles")body=`<p class="sub">${esc(q.sub)}</p><div class="q">${esc(q.prompt)}</div><div class="slot" id="slot"></div><div class="bank" id="bank"></div><button class="btn primary wide" id="chk" disabled>Перевірити</button>`;
if(q.kind==="type")body=(q.audio?`<div class="qaud">${spk2(q.audio,"big")}<span class="hid">${esc(q.sub)}</span></div>`:`<div class="q">${esc(q.prompt)}</div>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}`)+
`<input id="ans" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Напиши данською…" aria-label="Відповідь данською"><div class="dk">${["æ","ø","å"].map(c=>`<button class="chip" data-ch="${c}">${c}</button>`).join("")}</div><button class="btn primary wide" id="chk">Перевірити</button>`;
view.innerHTML=`<span class="prog big"><i style="width:${XS.i/XS.n*100}%"></i></span><p class="sub c">${XS.i+1} з ${XS.n} · ${esc(q.tag)}</p>`+body+`<div id="fb"></div>`;
if(q.kind==="choice")view.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{if(XS.done)return;const ok=b.dataset.o===q.ans;
view.querySelectorAll(".opts .btn").forEach(y=>{y.disabled=true;if(y.dataset.o===q.ans)y.classList.add("right");else if(y===b)y.classList.add("wrong")});feedback(ok,q.ans)});
if(q.kind==="tiles"){const draw=()=>{$("#slot").innerHTML=XS.pick.map((ti,pi)=>`<button class="tk" data-pi="${pi}">${esc(q.tiles[ti])}</button>`).join("");
$("#bank").innerHTML=q.tiles.map((t,ti)=>XS.pick.includes(ti)?`<span class="tk ghost">${esc(t)}</span>`:`<button class="tk" data-ti="${ti}">${esc(t)}</button>`).join("");$("#chk").disabled=!XS.pick.length||XS.done};
$("#bank").onclick=e=>{const b=e.target.closest("[data-ti]");if(!b||XS.done)return;XS.pick.push(+b.dataset.ti);draw()};
$("#slot").onclick=e=>{const b=e.target.closest("[data-pi]");if(!b||XS.done)return;XS.pick.splice(+b.dataset.pi,1);draw()};
$("#chk").onclick=()=>{if(XS.done)return;const got=XS.pick.map(i=>q.tiles[i]).join(" ");$("#chk").disabled=true;feedback(got===q.ans,q.ans+q.end)};draw()}
if(q.kind==="type"){const inp=$("#ans");if(!q.audio)setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50);else say(q.audio);
view.querySelectorAll("[data-ch]").forEach(c=>c.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.setRangeText(c.dataset.ch,s,e,"end");inp.focus()});
const check=()=>{if(XS.done)return;const u=norm(inp.value);if(!u){inp.focus();return}const acc=q.ans.map(norm),alt=(q.alt||[]).map(norm);let ok=acc.includes(u),note="";
if(!ok&&alt.includes(u)){ok=true;note=q.w&&q.w.art?`Не забудь артикль: ${q.ans[0]}.`:`Повна форма: ${q.ans[0]}.`}
else if(!ok&&acc.some(a=>a.length>=5&&lev(u,a)===1)){ok=true;note=`Маленька помилка. Правильно: ${q.ans[0]}.`}
inp.disabled=true;$("#chk").disabled=true;feedback(ok,q.ans[0],note)};
$("#chk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}}}}
function feedback(ok,correct,note){const q=XS.q;XS.done=true;if(ok)XS.ok++;else XS.wrong.push({p:q.prompt||q.audio||"",a:correct});
if(q.w)grade(q.w,ok);else bump();
const last=XS.i+1>=XS.n;
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Правильно!":"Не зовсім."}</b>${note?`<p>${esc(note)}</p>`:""}${!ok?`<p>Правильна відповідь: <b>${esc(correct)}</b></p>`:""}${q.full&&q.full!==correct?`<p>${esc(q.full)}</p>`:""}${q.uk||q.kind==="tiles"||q.kind==="choice"&&q.sub?`<p class="muted">${esc(q.uk||(q.kind==="tiles"?q.prompt:q.sub))}</p>`:""}<div class="fbs">${q.say?spk2(q.say):""}</div></div><button class="btn primary wide" id="nx">${last?"Результат":"Далі"}</button>`;
if(q.say&&!q.audio)say(q.say);
$("#nx").onclick=()=>{XS.i++;if(XS.i>=XS.n){exEnd();return}let n=genQ(XS.k),g=0;while(n.prompt===q.prompt&&n.audio===q.audio&&g++<6)n=genQ(XS.k);XS.q=n;exQ();window.scrollTo(0,0)};
$("#nx").scrollIntoView&&$("#nx").scrollIntoView({block:"nearest",behavior:"smooth"})}
function exEnd(){if(!T().parts.ex){T().parts.ex=true;save()}const pc=Math.round(XS.ok/XS.n*100);
view.innerHTML=`<div class="bigemoji">${pc>=80?"🏆":pc>=50?"💪":"📚"}</div><div class="score">${XS.ok}/${XS.n}</div><p class="sub c">${pc>=80?"Чудовий результат!":pc>=50?"Непогано, ще трохи практики.":"Повтори правила й спробуй ще раз."}</p>
${XS.wrong.length?`<h2 class="h2">Помилки</h2><div class="card2">${XS.wrong.map(w=>`<div class="ex"><div><span>${esc(w.p)}</span><b>${esc(w.a)}</b></div>${spk(w.a)}</div>`).join("")}</div>`:""}
<div class="two"><button class="btn" id="exback">До завдань</button><button class="btn primary" id="exagain">Ще раз</button></div>`;
$("#exagain").onclick=()=>{SCREENS.exrun(XS.k);window.scrollTo(0,0)};$("#exback").onclick=()=>back()}

if(qm==="rev")return{w,text:w.uk,opts:shuffle([w,...oth]).map(label),ans:label(w)};
return{w,text:label(w),opts:shuffle([w,...oth]).map(x=>x.uk),ans:w.uk}}
// n питань; слова не повторюються, доки не пройдено всю тему
function startQuiz(t,n){const P=inTopic(t),nouns=P.filter(w=>w.art),pool=qm==="art"&&nouns.length>1?nouns:P,list=[];
while(list.length<n)list.push(...shuffle(pool.slice()));QZ={t,n,mode:qm,list:list.slice(0,n),i:0,ok:0,wrong:[],q:null,ans:null};QZ.q=makeQ(P,QZ.list[0]);showQuiz(t)}
function showQuiz(t){const P=inTopic(t);
if(P.length<2){view.innerHTML=`<div class="note">Для тесту потрібно щонайменше два слова в темі.</div>`;return}
if(!QZ){const M=[["tr","Данська → укр"],["rev","Укр → данська"],["aud","На слух"]];if(P.filter(w=>w.art).length>1)M.push(["art","en чи et"]);else if(qm==="art")qm="tr";
view.innerHTML=`<h1 class="large">Тест</h1><p class="sub">${esc(t||"Усі слова")} · ${P.length} слів</p><h2 class="h2">Що перевіряємо</h2>
<div class="mode">${M.map(m=>`<button class="chip" data-m="${m[0]}" aria-pressed="${qm===m[0]}">${m[1]}</button>`).join("")}</div>
<h2 class="h2">Скільки питань</h2>${QLEN.map(n=>`<button class="btn primary wide qlen" data-n="${n}">Тест: ${n} питань</button>`).join("")}`;
view.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{qm=c.dataset.m;showQuiz(t)});
view.querySelectorAll(".qlen").forEach(b=>b.onclick=()=>{startQuiz(t,+b.dataset.n);window.scrollTo(0,0)});return}
if(QZ.i>=QZ.n){quizEnd(t);return}
const q=QZ.q,a=QZ.ans!=null,last=QZ.i===QZ.n-1,aud=QZ.mode==="aud";
view.innerHTML=`<div class="qhead"><span>Питання ${QZ.i+1} з ${QZ.n}</span><b>✓ ${QZ.ok}</b></div><span class="prog" style="--c1:#ff3b30;--c2:#ff9f0a"><i style="width:${(QZ.i+1)/QZ.n*100}%"></i></span>
${aud?`<div class="qaud">${spk2(label(q.w),"big")}<span id="qw" class="${a?"":"hid"}">${a?esc(label(q.w)):"Послухай і обери переклад"}</span></div>`:`<div class="q">${esc(q.text)}</div>`}
<div class="opts">${q.opts.map(o=>`<button class="btn${a?(o===q.ans?" right":o===QZ.ans?" wrong":""):""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
<button class="btn primary wide" id="nx" ${a?"":"disabled"}>${last?"Результат":"Далі"}</button>`;
view.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{if(QZ.ans!=null)return;QZ.ans=b.dataset.o;const ok=QZ.ans===q.ans;
S.total++;if(ok){S.right++;QZ.ok++}else QZ.wrong.push(q.w);grade(q.w,ok);if(!aud)say(label(q.w));showQuiz(t)});
$("#nx").onclick=()=>{QZ.i++;QZ.ans=null;if(QZ.i<QZ.n)QZ.q=makeQ(P,QZ.list[QZ.i]);showQuiz(t);window.scrollTo(0,0)};
if(aud&&!a)say(label(q.w))}
function quizEnd(t){const pc=Math.round(QZ.ok/QZ.n*100),W=[...new Set(QZ.wrong)];
view.innerHTML=`<div class="bigemoji">${pc>=90?"🏆":pc>=70?"🎉":pc>=50?"👍":"💪"}</div><div class="score">${QZ.ok} з ${QZ.n}</div><p class="sub c">Правильно ${pc}%</p>
${W.length?`<h2 class="h2">Повтори ці слова</h2><div class="list">${W.map(w=>`<div class="wl"><span class="tx" style="margin-left:0;flex:1;text-align:left"><b>${esc(label(w))}</b><small>${esc(w.uk)}</small></span>${spk(label(w))}</div>`).join("")}</div>`:""}
<div class="two"><button class="btn" id="qnew">Інший тест</button><button class="btn primary" id="qagain">Ще раз</button></div>`;
$("#qagain").onclick=()=>{qm=QZ.mode;startQuiz(t,QZ.n);window.scrollTo(0,0)};$("#qnew").onclick=()=>{QZ=null;showQuiz(t);window.scrollTo(0,0)}}

// ---------- ГРАМАТИКА ----------
SCREENS.grammar=()=>{view.innerHTML=`<h1 class="large">Граматика</h1><p class="sub">Частини мови</p><div class="list">`+GR.map((g,i)=>item(g.ic,g.t,`${g.items.length} правил з прикладами`,"gsec",i,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.gsec=i=>{const g=GR[+i];view.innerHTML=`<h1 class="large">${esc(g.t)}</h1>`+g.items.map(r=>`<section class="card2"><h3>${esc(r.t)}</h3><p>${hl(r.p)}</p>${r.ex.map(e=>{const[d,u]=e.split("|");return`<div class="ex"><div><b>${hl(d)}</b><span>${esc(u)}</span></div>${spk(d)}</div>`}).join("")}</section>`).join("")};

// ---------- ПИСЬМО ----------
const drafts={};
SCREENS.write=()=>{view.innerHTML=`<h1 class="large">Письмо</h1><p class="sub">Обери тип тексту</p><div class="list">`+WR.map((w,i)=>item(["📧","💌","💭","📣","💼","💡"][i]||"📝",w.t,w.task.split(". ")[0].slice(0,60)+"…","wtask",i,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.wtask=i=>{const w=WR[+i];
view.innerHTML=`<h1 class="large">${esc(w.t)}</h1><div class="note"><b>Завдання.</b> ${esc(w.task)}</div>
<details><summary>Приклад відповіді</summary><div class="pre">${esc(w.text)}</div><button class="link" data-say="${esc(w.text)}">Прослухати текст</button> · <button class="link" id="trb">Показати переклад (ШІ)</button><div class="pre" id="trout"></div><p>${esc(w.tips)}</p></details>
<details><summary>Корисні фрази</summary><div class="pre">${esc(PHR)}</div></details>
<textarea id="tx" rows="9" placeholder="Напиши свій текст данською…"></textarea>
<button class="btn primary wide" id="chk">Перевірити з ШІ</button><div class="pre out" id="out"></div>`;
const tx=$("#tx");tx.value=drafts[i]||"";tx.oninput=()=>drafts[i]=tx.value;
$("#trb").onclick=async()=>{const o=$("#trout");o.textContent="Перекладаю…";try{await ask(`Переклади українською, без коментарів:\n\n${w.text}`,x=>o.textContent=x)}catch(e){o.textContent=aiErr(e)}};
$("#chk").onclick=async()=>{const t=tx.value.trim(),o=$("#out"),b=$("#chk");if(t.length<20){o.textContent="Спочатку напиши текст.";return}
o.textContent="Перевіряю…";b.disabled=true;
try{await ask(INSTR+`\n\nЗавдання: ${w.task}\n\nТекст студента:\n${t}\n\nЗроби: 1) коротка оцінка; 2) помилки у форматі «фрагмент → виправлення → пояснення»; 3) виправлена версія данською; 4) дві поради для тесту.`,x=>o.textContent=x)}catch(e){o.textContent=aiErr(e)}
b.disabled=false}};

// ---------- ШІ-ТРЕНЕР ----------
let chat=[];
function drawLog(){const L=$("#log");if(!L)return;L.replaceChildren(...chat.map(m=>{const d=document.createElement("div");d.className="msg "+m.role;d.textContent=m.content;return d}))}
async function send(txt){if(!txt.trim()||chat.length&&chat[chat.length-1].content==="…")return;chat.push({role:"user",content:txt},{role:"assistant",content:"…"});drawLog();
const msgs=chat.slice(0,-1).map((m,i)=>i?m:{role:"user",content:INSTR+"\n\n"+m.content});
try{await ask(msgs,x=>{chat[chat.length-1].content=x;drawLog()})}catch(e){chat[chat.length-1].content=aiErr(e)}drawLog()}
SCREENS.ai=()=>{const P=[["Розмова: подорожі","Давай розмовляти данською про подорожі. Став мені питання по одному й виправляй мої помилки."],["Вправа на переклад","Дай 5 речень українською для перекладу данською на тему роботи, потім перевір мої відповіді."],["Пояснити правило","Поясни простою мовою, де в данській ставити ikke: до дієслова чи після."],["Підготовка до усної частини","Проведи зі мною коротке інтерв’ю данською, як на усній частині тесту, і дай відгук."]];
view.innerHTML=`<h1 class="large">ШІ-тренер</h1><div class="mode">${P.map((p,i)=>`<button class="chip" data-p="${i}">${p[0]}</button>`).join("")}</div><div id="log"></div><textarea id="in" rows="3" placeholder="Напиши повідомлення…"></textarea><button class="btn primary wide" id="send">Надіслати</button>`;
view.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>send(P[+c.dataset.p][1]));
$("#send").onclick=()=>{const v=$("#in").value;$("#in").value="";send(v)};drawLog()};

if(API&&"serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
render();
</script>
</body>
</html>

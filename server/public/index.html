<style>
:root{--bg:#f2f2f7;--glass:rgba(255,255,255,.66);--ink:#1c1c1e;--muted:#6c6c70;--line:rgba(60,60,67,.16);--red:#c8102e;--ok:#248a3d;--bad:#d70015;--b1:#ffd9de;--b2:#d2e5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--glass:rgba(44,44,46,.62);--ink:#f5f5f7;--muted:#98989f;--line:rgba(235,235,245,.16);--red:#ff6b81;--ok:#30d158;--bad:#ff6961;--b1:#4a1420;--b2:#10284a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--glass:rgba(44,44,46,.62);--ink:#f5f5f7;--muted:#98989f;--line:rgba(235,235,245,.16);--red:#ff6b81;--ok:#30d158;--bad:#ff6961;--b1:#4a1420;--b2:#10284a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;line-height:1.45;background:radial-gradient(circle at 12% 0%,var(--b1),transparent 45%),radial-gradient(circle at 100% 30%,var(--b2),transparent 50%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;height:48px;padding:0 8px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line)}
#ttl{text-align:center;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{justify-self:start;background:none;border:0;color:var(--red);font:inherit;font-size:1.05rem;padding:8px;cursor:pointer}
#back[hidden]{display:block;visibility:hidden}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.large{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;margin:10px 2px 4px}
.large span{color:var(--red)}
.sub{color:var(--muted);margin:0 2px 16px}.sub.c{text-align:center}
.list{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--line)}
.ic{font-style:normal;width:40px;height:40px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:1.3rem;flex:none}
.big .item{padding:16px}.big .ic{width:52px;height:52px;border-radius:14px;font-size:1.6rem}.big .tx b{font-size:1.12rem}
.tx{flex:1;display:flex;flex-direction:column;min-width:0}.tx b{font-weight:600}.tx small{color:var(--muted)}
.item em{font-style:normal;color:var(--muted);font-size:1.5rem}
button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.two{display:flex;gap:10px;margin-bottom:12px}
.btn{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.again{color:var(--red)}
.btn.wide{width:100%;margin-bottom:12px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--red);font:inherit;cursor:pointer;padding:6px 0}
.wl{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.wl:first-child{border-top:0}.wl span{color:var(--muted);text-align:right}.wl.done b{color:var(--ok)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:24px;padding:32px 20px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;font:inherit;color:inherit;cursor:pointer;margin-bottom:12px}
.card .da{font-size:2.3rem;font-weight:700;letter-spacing:-.02em}.card .uk{font-size:1.6rem;font-weight:600}.card .hint{color:var(--muted);font-size:.85rem;margin-top:10px}
.exbox{text-align:center;margin-bottom:12px;min-height:44px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{font-size:1.6rem;font-weight:700;margin:6px 2px 14px}
.opts{display:grid;gap:8px;margin-bottom:12px}.opts .btn{text-align:left}
.opts .btn.right{border-color:var(--ok);color:var(--ok)}.opts .btn.wrong{border-color:var(--bad);color:var(--bad)}
.card2,details{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card2 h3{margin:0 0 4px;font-size:1.05rem}.card2 p{margin:0 0 10px;color:var(--muted)}
.ex{display:flex;flex-direction:column;padding:8px 0 8px 12px;border-left:3px solid var(--red);margin-bottom:6px}.ex span{color:var(--muted);font-size:.92rem}
mark{background:none;color:var(--red);font-weight:700}
summary{font-weight:600;cursor:pointer}
details>*:not(summary){margin-top:10px}
.note{background:var(--glass);border-left:3px solid var(--red);padding:10px 14px;margin-bottom:12px;border-radius:0 12px 12px 0}
textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;resize:vertical;margin-bottom:12px}
.pre{white-space:pre-wrap}.out{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.out:empty{display:none}
#log{display:grid;gap:8px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:18px;white-space:pre-wrap;max-width:88%}
.msg.user{background:var(--red);color:#fff;justify-self:end}.msg.assistant{background:var(--glass);border:1px solid var(--line)}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(200,16,46,.12);color:var(--red);display:grid;place-items:center;cursor:pointer;padding:0}
.spk.big{width:60px;height:60px}.spk.big svg{width:30px;height:30px}
.spk:active,.lt:active{transform:scale(.94)}
.wl{align-items:center}.wl span{margin-left:auto}
.ex{flex-direction:row;align-items:center;gap:10px}.ex>div{flex:1;display:flex;flex-direction:column;min-width:0}
.exbox .spk{display:inline-grid;vertical-align:middle;width:30px;height:30px;margin-left:6px}
.cardbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.qaud{display:flex;align-items:center;gap:16px;margin:6px 2px 14px}.qaud span{font-size:1.4rem;font-weight:700}.qaud span.hid{color:var(--muted);font-size:1rem;font-weight:400}
.h2{font-size:1.25rem;margin:22px 2px 10px}
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.lt{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font:inherit;color:var(--ink);cursor:pointer}
.lt b{font-size:1.45rem;letter-spacing:-.02em}.lt span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.wlb{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-width:0}

.wl.done .wlb b{color:var(--ok)}

const GR=[
{t:"Іменники",ic:"🏠",items:[
{t:"Рід: en чи et",p:"Іменник має спільний рід (en) або середній (et). Приблизно три слова з чотирьох — en, тому вчи слово відразу з артиклем.",ex:["*en* bog|книга","*et* hus|будинок","*en* kvinde, *et* barn|жінка, дитина"]},
{t:"Означена форма",p:"Означений артикль додається в кінець слова: en → -en, et → -et. Якщо слово закінчується на -e, додається лише -n або -t.",ex:["en bog → bog*en*|книга → ця книга","et hus → hus*et*|будинок → цей будинок","en pige → pige*n*|дівчина → ця дівчина"]},
{t:"Множина",p:"Три основні закінчення: -er, -e або без закінчення. Часто змінюється голосна, тому вчи множину разом зі словом.",ex:["en dag → dag*e*|день → дні","en bog → b*ø*ger|книга → книги","et barn → b*ø*rn|дитина → діти","en lærer → lærer*e*|вчитель → вчителі"]},
{t:"Присвійний -s",p:"Приналежність виражається додаванням -s, без апострофа.",ex:["Anne*s* bil|машина Анни","min vens hus|будинок мого друга"]}]},
{t:"Займенники",ic:"👤",items:[
{t:"Особові",p:"Підмет: jeg, du, han, hun, den/det, vi, I, de. Додаток: mig, dig, ham, hende, den/det, os, jer, dem.",ex:["*Jeg* kender *dig*.|Я знаю тебе.","*Hun* hjælper *mig*.|Вона допомагає мені.","*Vi* ser *dem* i morgen.|Ми побачимо їх завтра."]},
{t:"Присвійні",p:"min/mit/mine, din/dit/dine залежать від роду й числа речі. Hans, hendes, vores, jeres, deres не змінюються.",ex:["*min* bil, *mit* hus, *mine* børn|моя машина, мій дім, мої діти","*hendes* bror|її брат","*vores* lejlighed|наша квартира"]},
{t:"Свій: sin/sit/sine",p:"Якщо власник — підмет цього ж речення, вживай sin/sit/sine. Якщо це інша особа — hans/hendes.",ex:["Han elsker *sin* kone.|Він кохає свою дружину.","Han ser *hans* bror.|Він бачить його (чужого) брата."]},
{t:"Питальні й вказівні",p:"hvem (хто), hvad (що), hvilken/hvilket/hvilke (який), denne/dette/disse (цей).",ex:["*Hvem* er det?|Хто це?","*Hvilket* hus bor du i?|У якому будинку ти живеш?"]},
{t:"Зворотний sig",p:"sig вживається, коли дія повертається на підмет (han, hun, de). Для jeg, du, vi: mig, dig, os.",ex:["Han vasker *sig*.|Він миється.","Jeg glæder *mig*.|Я з нетерпінням чекаю."]}]},
{t:"Дієслова",ic:"🏃",items:[
{t:"Теперішній час",p:"Не змінюється за особами: до кореня додається -r або -er.",ex:["at bo → jeg bo*r*|жити → я живу","at købe → vi købe*r*|купувати → ми купуємо","at spise → de spise*r*|їсти → вони їдять"]},
{t:"Минулий час",p:"Правильні дієслова: -ede або -te. Неправильні треба вчити напам’ять.",ex:["Jeg bo*ede* i Odense.|Я жив в Оденсе.","Hun køb*te* en bog.|Вона купила книгу.","Vi *var* i Aarhus.|Ми були в Орхусі."]},
{t:"Перфект: har/er + дієприкметник",p:"Минуле, пов’язане з теперішнім. Зазвичай har, а для руху й зміни стану — er.",ex:["Jeg *har boet* her i to år.|Я живу тут уже два роки.","Han *er kommet* hjem.|Він прийшов додому.","Har du *spist*?|Ти вже поїв?"]},
{t:"Неправильні дієслова",p:"Форми: інфінітив – минулий – дієприкметник.",ex:["at være – var – været|бути","at have – havde – haft|мати","at gå – gik – gået|йти","at se – så – set|бачити","at tage – tog – taget|брати","at give – gav – givet|давати","at skrive – skrev – skrevet|писати","at finde – fandt – fundet|знаходити","at sige – sagde – sagt|казати","at drikke – drak – drukket|пити"]},
{t:"Модальні дієслова",p:"kan (вмію, можу), skal (маю), vil (хочу), må (мушу, можна), bør (варто) + інфінітив без at.",ex:["Jeg *kan* tale dansk.|Я вмію говорити данською.","Du *skal* komme kl. 8.|Ти маєш прийти о 8.","Vi *vil* gerne bestille bord.|Ми хочемо замовити столик.","Man *må* ikke ryge her.|Тут не можна палити."]},
{t:"Майбутнє",p:"Часто vil/skal + інфінітив або kommer til at. Для планів досить теперішнього часу з обставиною.",ex:["Jeg *rejser* i morgen.|Я їду завтра.","Det *kommer til at* regne.|Піде дощ.","Hun *vil* blive læge.|Вона стане лікаркою."]},
{t:"Наказовий спосіб",p:"Корінь дієслова без закінчення. Для ввічливості додай tak.",ex:["*Kom* herind!|Заходь сюди!","*Vent* et øjeblik, tak.|Зачекайте хвилинку, будь ласка.","*Skriv* til mig.|Напиши мені."]},
{t:"Пасив",p:"Інфінітив + -s або blive + дієприкметник.",ex:["Bogen *læses* af mange.|Книгу читають багато людей.","Huset *blev bygget* i 1990.|Будинок збудували в 1990 році."]}]},
{t:"Прикметники",ic:"🎨",items:[
{t:"Узгодження",p:"en: основна форма; et: +t; множина й означена форма: +e.",ex:["en *stor* by|велике місто","et *stort* hus|великий будинок","*store* byer|великі міста"]},
{t:"Означена форма",p:"den/det/de + прикметник на -e + іменник.",ex:["den *store* by|це велике місто","det *nye* job|нова робота","de *gamle* huse|старі будинки"]},
{t:"Ступені порівняння",p:"Правильні: -ere, -est. Часті неправильні форми варто вивчити.",ex:["billig – billig*ere* – billig*st*|дешевий – дешевший – найдешевший","god – bedre – bedst|добрий – кращий – найкращий","mange – flere – flest|багато – більше – найбільше","lille – mindre – mindst|малий – менший – найменший"]}]},
{t:"Прийменники",ic:"📍",items:[
{t:"Місце",p:"i: всередині міста чи країни; på: установи, острови, поверхні; hos: у людини вдома; ved: біля.",ex:["Jeg bor *i* København.|Я живу в Копенгагені.","Hun er *på* arbejde.|Вона на роботі.","Vi er *hos* Anne.|Ми в Анни.","Bordet står *ved* vinduet.|Стіл стоїть біля вікна."]},
{t:"Напрямок",p:"til: рух до; fra: звідки; hjem: додому (без til).",ex:["Jeg rejser *til* Danmark.|Я їду до Данії.","Han kommer *fra* Ukraine.|Він родом з України.","Vi går *hjem*.|Ми йдемо додому."]},
{t:"Час",p:"kl.: година; om: через або у часі; i: протягом; på: наступного дня тижня; før/efter: до/після.",ex:["Mødet er *kl.* 14.|Зустріч о 14:00.","Jeg kommer *om* en time.|Я прийду за годину.","Jeg har boet her *i* to år.|Я живу тут два роки.","Vi ses *på* mandag.|Побачимось у понеділок."]},
{t:"Інші частотні",p:"med (з), uden (без), om (про), for (для), af (від, з), mod (проти), mellem (між).",ex:["Jeg taler *med* min chef.|Я розмовляю з керівником.","kaffe *uden* sukker|кава без цукру","Vi taler *om* arbejde.|Ми говоримо про роботу.","Det er godt *for* dig.|Це добре для тебе."]}]},
{t:"Сполучники",ic:"🔗",items:[
{t:"Сурядні: og, men, eller, for, så",p:"Порядок слів після них не змінюється.",ex:["Jeg er træt, *men* jeg arbejder.|Я втомлений, але працюю.","Vil du have te *eller* kaffe?|Хочеш чай чи каву?"]},
{t:"Підрядні: at, fordi, hvis, når, selvom",p:"У підрядному реченні порядок такий: підмет, ikke чи прислівник, дієслово.",ex:["Jeg tror, *at* han *ikke* kommer.|Думаю, що він не прийде.","Jeg bliver hjemme, *fordi* jeg er syg.|Я лишаюся вдома, бо хворий.","*Hvis* det regner, bliver vi hjemme.|Якщо піде дощ, залишимося вдома.","*Selvom* jeg er træt, arbejder jeg.|Хоч я втомлений, я працюю."]},
{t:"Зв’язки для письма",p:"Слова, які роблять текст логічним: for det første, for det andet, desuden, til gengæld, derfor, endelig.",ex:["*For det første* sparer man tid.|По-перше, економиться час.","*Desuden* er det billigere.|До того ж це дешевше.","*Til gengæld* er det ensomt.|Натомість це самотньо.","*Derfor* mener jeg, at …|Тому я вважаю, що …"]}]},
{t:"Порядок слів",ic:"🧱",items:[
{t:"V2: дієслово на другому місці",p:"У головному реченні дієслово стоїть другим. Якщо на початку обставина, підмет іде після дієслова.",ex:["Jeg *bor* i København.|Я живу в Копенгагені.","I dag *bor* jeg i Odense.|Сьогодні я живу в Оденсе."]},
{t:"Питання",p:"Без питального слова дієслово перше. З hvad, hvor, hvornår, hvorfor, hvordan, hvem: слово, потім дієслово.",ex:["*Bor* du her?|Ти тут живеш?","*Hvornår* åbner banken?|Коли відкривається банк?"]},
{t:"Заперечення ikke",p:"У головному реченні після дієслова, у підрядному перед ним. Aldrig (ніколи) поводиться так само.",ex:["Jeg bor *ikke* her.|Я тут не живу.","Jeg ved, at han *ikke* bor her.|Я знаю, що він тут не живе.","Hun kommer *aldrig* for sent.|Вона ніколи не запізнюється."]}]},

{t:"Порядкові числівники й дати",p:"1. første, 2. anden, 3. tredje, 4. fjerde. Дата: den 12. december.",ex:["Min fødselsdag er *den 12. december*.|Мій день народження 12 грудня.","Det er *første* gang.|Це перший раз."]}]},

{t:"Складні слова",p:"Данська легко з’єднує слова в одне. Рід і множину визначає остання частина. Між частинами часто з’являється -s- або -e-.",ex:["et køkken + et bord → et *køkkenbord*|кухонний стіл","et arbejde + en tid → en *arbejdstid*|робочий час","en skole + en lærer → en *skolelærer*|шкільний учитель"]},
{t:"Незлічувані іменники",p:"Речовини й абстрактні поняття вживаються без en/et. Для «трохи» кажуть noget, для «багато» meget. Penge (гроші) завжди в множині.",ex:["Jeg drikker *vand*.|Я п’ю воду.","Kan jeg få *noget* mælk?|Можна трохи молока?","Har du *mange penge*?|У тебе багато грошей?"]}]);

{t:"Неозначені займенники",p:"nogen (хтось, якісь), noget (щось), nogle (кілька), ingen (ніхто, жоден), intet (ніщо), alle (усі), alt (усе), hver/hvert (кожен).",ex:["Er der *nogen* hjemme?|Є хтось удома?","Jeg har *noget* at sige.|Мені є що сказати.","*Nogle* venner kommer i aften.|Увечері прийдуть кілька друзів.","Der er *ingen* mælk.|Молока немає.","*Hver* dag lærer jeg ti ord.|Щодня я вчу десять слів."]},

{t:"Дієслова на -s",p:"Деякі дієслова завжди мають закінчення -s: synes, mødes, ses, findes, lykkes. Вони не мають наказової форми.",ex:["Jeg *synes*, det er en god idé.|Я вважаю, що це гарна ідея.","Vi *ses* i morgen!|Побачимось завтра!","Der *findes* mange muligheder.|Існує багато можливостей."]},
{t:"Зворотні дієслова",p:"Дієслово + займенник: mig, dig, sig, os, jer, sig. Часті: glæde sig, skynde sig, sætte sig, føle sig, interessere sig for.",ex:["Jeg *glæder mig* til ferien.|Я з нетерпінням чекаю відпустки.","Vi *skynder os*.|Ми поспішаємо.","Hun *føler sig* træt.|Вона почувається втомленою.","*Sæt dig* ned!|Сідай!"]},

{t:"Дія в процесі",p:"Данська не має окремого тривалого часу. Замість нього: være ved at або sidde/stå/ligge og + дієслово.",ex:["Jeg *er ved at* lave mad.|Я саме готую їжу.","Hun *sidder og* læser.|Вона сидить і читає.","De *står og* venter på bussen.|Вони стоять і чекають автобус."]},
{t:"Звичка й щойно",p:"plejer at — «зазвичай»; har lige — «щойно»; skal til at — «якраз збираюся».",ex:["Jeg *plejer at* cykle på arbejde.|Я зазвичай їжджу на роботу велосипедом.","Jeg *har lige* spist.|Я щойно поїв.","Vi *skal til at* gå.|Ми якраз збираємося йти."]},
{t:"Умовний спосіб",p:"ville + інфінітив: «я б». Нереальна умова: hvis + минулий час, головне речення з ville.",ex:["Jeg *ville* gerne have en kaffe.|Я б хотів каву.","*Hvis* jeg *havde* tid, *ville* jeg rejse.|Якби я мав час, я б подорожував.","*Hvis* jeg *havde vidst* det, *ville* jeg *være kommet*.|Якби я знав, я б прийшов."]},
{t:"Модальні в минулому",p:"Форми минулого часу модальних дієслів: kunne, skulle, ville, måtte, burde.",ex:["Jeg *kunne* ikke komme.|Я не міг прийти.","Du *burde* ringe til lægen.|Тобі варто зателефонувати лікареві.","Vi *skulle* mødes kl. 10.|Ми мали зустрітися о 10."]},
{t:"Інфінітив з at і без at",p:"Після модальних дієслів at не ставиться. Після інших дієслів і виразів потрібне at.",ex:["Jeg *kan* svømme.|Я вмію плавати.","Jeg *prøver at* lære dansk.|Я намагаюся вивчити данську.","Det er sjovt *at* rejse.|Подорожувати весело."]},

while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d||d==="[DONE]")continue;

TI["Мої слова"]="⭐";if(ALL.some(w=>w.t==="Мої слова")&&!TOPICS.includes("Мої слова"))TOPICS.unshift("Мої слова");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY);
function T(){if(!S.today||S.today.d!==todayStr())S.today={d:todayStr(),n:0,parts:{}};return S.today}
function bump(part){const t=T();t.n++;if(part)t.parts[part]=true;touch();save()}
function grade(w,ok){const b=S.box[w.da]||0,nb=ok?Math.min(4,b+1):0;S.box[w.da]=nb;S.due[w.da]=Date.now()+INT[nb]*DAY;bump()}
const dueWords=()=>{const now=Date.now();return ALL.filter(w=>w.da in S.box&&(S.due[w.da]||0)<=now)};
function newToday(){if(!S.plan||S.plan.d!==todayStr()){const f=[];for(const t of TOPICS){for(const w of ALL)if(w.t===t&&!(w.da in S.box)&&f.length<10)f.push(w.da);if(f.length>=10)break}S.plan={d:todayStr(),nw:f};save()}
return S.plan.nw.map(da=>ALL.find(w=>w.da===da)).filter(w=>w&&!(w.da in S.box))}
const RULES_ALL=()=>{const a=[];GR.forEach((g,gi)=>g.items.forEach((r,ri)=>a.push(gi+"."+ri)));return a};
const ruleOfDay=()=>{const a=RULES_ALL();return a[dayNum()%a.length]};
const ring=(pct,c)=>`<svg class="ring" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="27" fill="none" stroke="${c||"var(--red)"}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(pct/100*169.6).toFixed(1)} 169.6" transform="rotate(-90 32 32)"/></svg>`;

todo("🔁","Повторити слова",due+nw?`${due} на повторення · ${nw} нових`:"На сьогодні все повторено","review","",t.parts.rev)+
todo("🧩","Правило дня",GR[rd[0]].items[rd[1]].t,"rule",rd.join("."),t.parts.rule)+
todo("🎲","Вправа дня","10 завдань різних типів","exrun","mix",t.parts.ex)+
todo("📖","Текст дня",TEXTS[ti].t,"text",ti,t.parts.read)+`</div>`};
SCREENS.rule=a=>{const[gi,ri]=a.split(".").map(Number),g=GR[gi],r=g.items[ri];if(a===ruleOfDay()&&!T().parts.rule)bump("rule");
view.innerHTML=`<p class="sub">${esc(g.t)}</p><h1 class="large">${esc(r.t)}</h1><section class="card2"><p>${hl(r.p)}</p>${r.ex.map(e=>{const[d,u]=e.split("|");return`<div class="ex"><div><b>${hl(d)}</b><span>${esc(u)}</span></div>${spk(d)}</div>`}).join("")}</section>
<button class="btn wide" data-go="gsec" data-a="${gi}">Усі правила розділу «${esc(g.t)}»</button><button class="btn primary wide" data-go="exrun" data-a="gap">Потренуватися: встав слово</button>`};
let RV=null;
SCREENS.review=()=>{const due=shuffle(dueWords()).slice(0,30),nw=newToday();RV={q:due.concat(nw),done:0,total:due.length+nw.length,flip:false,spoken:null};showRev()};

view.innerHTML=`<div class="bigemoji">🎉</div><h1 class="large c">${RV.total?"Готово!":"Усе повторено"}</h1><p class="sub c">${RV.total?`Ти пройшов ${RV.total} слів. Наступні повторення з’являться завтра.`:"Слів на повторення немає. Можеш узяти нову тему в розділі «Слова»."}</p><button class="btn primary wide" data-go="exrun" data-a="mix">Зробити вправу дня</button>`;return}
const w=RV.q[0],isNew=!(w.da in S.box),f=RV.flip;
view.innerHTML=`<span class="prog big"><i style="width:${RV.done/RV.total*100}%"></i></span><p class="sub c">${RV.done} з ${RV.total}${isNew?" · нове слово":""}</p>
<button class="card" id="card" aria-label="Перевернути картку">${f?`<div class="uk">${esc(w.uk)}</div><div class="hint">${esc(w.t)}</div>`:`<div class="da">${esc(label(w))}</div><div class="hint">торкнись, щоб побачити переклад</div>`}</button>
<div class="cardbar">${spk2(label(w),"big")}</div>${f?`<p class="c"><button class="link" data-go="word" data-a="${esc(w.da)}">Усі форми й приклади ›</button></p>`:""}
<div class="two"><button class="btn again" id="again" ${f?"":"disabled"}>Ще раз</button><button class="btn primary" id="know" ${f?"":"disabled"}>Знаю</button></div>`;
$("#card").onclick=()=>{RV.flip=!RV.flip;showRev()};
$("#again").onclick=()=>{grade(w,false);RV.q.push(RV.q.shift());RV.flip=false;showRev()};
$("#know").onclick=()=>{grade(w,true);RV.q.shift();RV.done++;RV.flip=false;showRev()};
if(S.auto&&!f&&RV.spoken!==w){RV.spoken=w;say(label(w))}}

// ---------- ЗАВДАННЯ ----------
const EXT=[{k:"mix",ic:"🎲",t:"Мікс",s:"Усього потроху"},{k:"gap",ic:"🧩",t:"Встав слово",s:"Речення з пропуском"},{k:"build",ic:"🧱",t:"Збери речення",s:"Переклад з української з плиток"},{k:"write",ic:"⌨️",t:"Напиши данською",s:"Переклад слова з клавіатури"},{k:"verb",ic:"🏃",t:"Форми дієслів",s:"Теперішній, минулий, перфект"},{k:"noun",ic:"🏠",t:"Рід і множина",s:"en чи et, множина іменників"},{k:"dict",ic:"🎧",t:"Диктант",s:"Послухай і запиши"}];
let EXP=null;
function exPools(){if(EXP)return EXP;const gap=[],sent=[];
GR.forEach(g=>g.items.forEach(r=>r.ex.forEach(e=>{const[d,u]=e.split("|");if(!u||/[→–=\/()]/.test(d))return;const plain=d.replace(/\*/g,"").trim(),wc=plain.split(/\s+/).length;
if(wc>=3&&wc<=10&&/[.!?]$/.test(plain))sent.push({da:plain,uk:u.trim(),g:g.t});
const m=d.match(/(^|[^\p{L}])\*([^*]+)\*(?!\p{L})/u);
if(m&&wc>=3&&m[2].split(" ").length<=3){const st=m.index+m[1].length;gap.push({q:(d.slice(0,st)+"_____"+d.slice(st+m[2].length+2)).replace(/\*/g,""),ans:m[2],uk:u.trim(),g:g.t,da:plain})}})));
EXP={gap,sent};return EXP}
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:«»"“”]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const uniq=a=>[...new Set(a)];
function genQ(k){const P=exPools();
if(k==="mix")k=rnd(["gap","build","write","verb","noun"].concat(TTS?["dict"]:[]));
if(k==="gap"){const x=rnd(P.gap),lc=x.ans.toLowerCase();let pool=uniq(shuffle(P.gap.filter(y=>y.g===x.g)).map(y=>y.ans)).filter(a=>a.toLowerCase()!==lc);
if(pool.length<3)pool=uniq(pool.concat(shuffle(P.gap).map(y=>y.ans))).filter(a=>a.toLowerCase()!==lc);
return{kind:"choice",tag:"Встав слово",prompt:x.q,sub:x.uk,opts:shuffle([x.ans,...pool.slice(0,3)]),ans:x.ans,say:x.da,full:x.da}}
if(k==="build"){const x=rnd(P.sent),end=x.da.slice(-1),toks=x.da.slice(0,-1).split(/\s+/),low=toks.map(t=>norm(t));
const extra=uniq(shuffle(P.sent.filter(y=>y!==x)).flatMap(y=>norm(y.da).split(" "))).filter(t=>t.length>1&&!low.includes(t)).slice(0,2);
return{kind:"tiles",tag:"Збери речення",prompt:x.uk,sub:"Склади речення данською",tiles:shuffle(toks.concat(extra)),ans:toks.join(" "),end,say:x.da,full:x.da}}
if(k==="write"){const ok=w=>w.da.split(" ").length<=3&&!/[?!]/.test(w.da);let src=ALL.filter(w=>(S.box[w.da]||0)>=1&&ok(w));if(src.length<8)src=ALL.filter(ok);const w=rnd(src);
return{kind:"type",tag:"Напиши данською",prompt:w.uk,sub:w.art?"Іменник: напиши разом з en або et":/^at /.test(w.da)?"Дієслово: напиши з at":"",ans:[label(w)],alt:[w.da.replace(/^at /,"")],say:label(w),w}}
if(k==="verb"){const ks=Object.keys(VB).filter(s=>ALL.some(w=>w.da==="at "+s)&&!/^(kunne|skulle|ville|måtte|burde)$/.test(s)&&!(/s$/.test(s)&&VB[s].split("|")[0]===s)),st=rnd(ks),[pres,past,part,aux]=VB[st].split("|"),
e=st.endsWith("e"),b=e?st.slice(0,-1):st,f1=(e?st:st+"e")+"de",f2=b+"te",f3=b+"et",w=ALL.find(x=>x.da==="at "+st);
const T3=[["Теперішній час",pres,[st,past,b+"er",st+"r"]],["Минулий час",past,[f1,f2,pres,part]]];if(aux!=="har/er")T3.push(["Перфект",aux+" "+part,[(aux==="har"?"er":"har")+" "+part,aux+" "+past,aux+" "+f3]]);
const[nm,ans,dis]=rnd(T3),opts=uniq(dis).filter(o=>o!==ans).slice(0,3);
return{kind:"choice",tag:"Форми дієслів",prompt:`at ${st} → ${nm.toLowerCase()}`,sub:w?w.uk:"",opts:shuffle([ans,...opts]),ans,say:ans,full:`at ${st} – ${pres} – ${past} – ${aux} ${part}`}}
if(k==="noun"){const ns=ALL.filter(w=>w.art&&NB[w.da]);if(Math.random()<.5){const w=rnd(ALL.filter(x=>x.art));return{kind:"choice",tag:"Рід іменника",prompt:w.da,sub:w.uk,opts:["en","et"],ans:w.art,say:label(w),full:label(w)}}
const w=rnd(ns),[sd,pi,pd]=NB[w.da].split("|"),fake=uniq([w.da+"er",w.da.endsWith("e")?w.da+"r":w.da+"e",sd,pd]).filter(x=>x!==pi);
return{kind:"choice",tag:"Множина",prompt:`${label(w)} → множина`,sub:w.uk,opts:shuffle([pi,...shuffle(fake).slice(0,3)]),ans:pi,say:pi,full:`${label(w)} – ${sd} – ${pi} – ${pd}`}}
if(k==="dict"){if(Math.random()<.4){const x=rnd(P.sent.filter(s=>s.da.split(" ").length<=6));return{kind:"type",tag:"Диктант",audio:x.da,sub:"Послухай і запиши речення",ans:[x.da],say:x.da,uk:x.uk}}
const w=rnd(ALL.filter(x=>x.da.split(" ").length<=2&&!/[?!]/.test(x.da)));return{kind:"type",tag:"Диктант",audio:label(w),sub:"Послухай і запиши слово",ans:[label(w)],alt:[w.da.replace(/^at /,"")],say:label(w),uk:w.uk,w}}
return genQ("gap")}
let XS=null;
SCREENS.ex=()=>{view.innerHTML=`<h1 class="large">Завдання</h1><p class="sub">Кожна сесія — 10 вправ</p><div class="list">`+EXT.filter(x=>x.k!=="dict"||TTS).map((x,i)=>item(x.ic,x.t,x.s,"exrun",x.k,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.exrun=k=>{XS={k,i:0,n:10,ok:0,wrong:[],q:genQ(k),done:false,pick:[]};exQ()};
function exQ(){const q=XS.q;XS.done=false;XS.pick=[];
let body="";
if(q.kind==="choice")body=`<div class="q">${esc(q.prompt)}</div>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}<div class="opts">${q.opts.map(o=>`<button class="btn" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
if(q.kind==="tiles")body=`<p class="sub">${esc(q.sub)}</p><div class="q">${esc(q.prompt)}</div><div class="slot" id="slot"></div><div class="bank" id="bank"></div><button class="btn primary wide" id="chk" disabled>Перевірити</button>`;
if(q.kind==="type")body=(q.audio?`<div class="qaud">${spk2(q.audio,"big")}<span class="hid">${esc(q.sub)}</span></div>`:`<div class="q">${esc(q.prompt)}</div>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}`)+
`<input id="ans" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Напиши данською…" aria-label="Відповідь данською"><div class="dk">${["æ","ø","å"].map(c=>`<button class="chip" data-ch="${c}">${c}</button>`).join("")}</div><button class="btn primary wide" id="chk">Перевірити</button>`;
view.innerHTML=`<span class="prog big"><i style="width:${XS.i/XS.n*100}%"></i></span><p class="sub c">${XS.i+1} з ${XS.n} · ${esc(q.tag)}</p>`+body+`<div id="fb"></div>`;
if(q.kind==="choice")view.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{if(XS.done)return;const ok=b.dataset.o===q.ans;
view.querySelectorAll(".opts .btn").forEach(y=>{y.disabled=true;if(y.dataset.o===q.ans)y.classList.add("right");else if(y===b)y.classList.add("wrong")});feedback(ok,q.ans)});
if(q.kind==="tiles"){const draw=()=>{$("#slot").innerHTML=XS.pick.map((ti,pi)=>`<button class="tk" data-pi="${pi}">${esc(q.tiles[ti])}</button>`).join("");
$("#bank").innerHTML=q.tiles.map((t,ti)=>XS.pick.includes(ti)?`<span class="tk ghost">${esc(t)}</span>`:`<button class="tk" data-ti="${ti}">${esc(t)}</button>`).join("");$("#chk").disabled=!XS.pick.length||XS.done};
$("#bank").onclick=e=>{const b=e.target.closest("[data-ti]");if(!b||XS.done)return;XS.pick.push(+b.dataset.ti);draw()};
$("#slot").onclick=e=>{const b=e.target.closest("[data-pi]");if(!b||XS.done)return;XS.pick.splice(+b.dataset.pi,1);draw()};
$("#chk").onclick=()=>{if(XS.done)return;const got=XS.pick.map(i=>q.tiles[i]).join(" ");$("#chk").disabled=true;feedback(got===q.ans,q.ans+q.end)};draw()}
if(q.kind==="type"){const inp=$("#ans");if(!q.audio)setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50);else say(q.audio);
view.querySelectorAll("[data-ch]").forEach(c=>c.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.setRangeText(c.dataset.ch,s,e,"end");inp.focus()});
const check=()=>{if(XS.done)return;const u=norm(inp.value);if(!u){inp.focus();return}const acc=q.ans.map(norm),alt=(q.alt||[]).map(norm);let ok=acc.includes(u),note="";
if(!ok&&alt.includes(u)){ok=true;note=q.w&&q.w.art?`Не забудь артикль: ${q.ans[0]}.`:`Повна форма: ${q.ans[0]}.`}
else if(!ok&&acc.some(a=>a.length>=5&&lev(u,a)===1)){ok=true;note=`Маленька помилка. Правильно: ${q.ans[0]}.`}
inp.disabled=true;$("#chk").disabled=true;feedback(ok,q.ans[0],note)};
$("#chk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}}}}
function feedback(ok,correct,note){const q=XS.q;XS.done=true;if(ok)XS.ok++;else XS.wrong.push({p:q.prompt||q.audio||"",a:correct});
if(q.w)grade(q.w,ok);else bump();
const last=XS.i+1>=XS.n;
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Правильно!":"Не зовсім."}</b>${note?`<p>${esc(note)}</p>`:""}${!ok?`<p>Правильна відповідь: <b>${esc(correct)}</b></p>`:""}${q.full&&q.full!==correct?`<p>${esc(q.full)}</p>`:""}${q.uk||q.kind==="tiles"||q.kind==="choice"&&q.sub?`<p class="muted">${esc(q.uk||(q.kind==="tiles"?q.prompt:q.sub))}</p>`:""}<div class="fbs">${q.say?spk2(q.say):""}</div></div><button class="btn primary wide" id="nx">${last?"Результат":"Далі"}</button>`;
if(q.say&&!q.audio)say(q.say);
$("#nx").onclick=()=>{XS.i++;if(XS.i>=XS.n){exEnd();return}let n=genQ(XS.k),g=0;while(n.prompt===q.prompt&&n.audio===q.audio&&g++<6)n=genQ(XS.k);XS.q=n;exQ();window.scrollTo(0,0)};
$("#nx").scrollIntoView&&$("#nx").scrollIntoView({block:"nearest",behavior:"smooth"})}
function exEnd(){if(!T().parts.ex){T().parts.ex=true;save()}const pc=Math.round(XS.ok/XS.n*100);
view.innerHTML=`<div class="bigemoji">${pc>=80?"🏆":pc>=50?"💪":"📚"}</div><div class="score">${XS.ok}/${XS.n}</div><p class="sub c">${pc>=80?"Чудовий результат!":pc>=50?"Непогано, ще трохи практики.":"Повтори правила й спробуй ще раз."}</p>
${XS.wrong.length?`<h2 class="h2">Помилки</h2><div class="card2">${XS.wrong.map(w=>`<div class="ex"><div><span>${esc(w.p)}</span><b>${esc(w.a)}</b></div>${spk(w.a)}</div>`).join("")}</div>`:""}
<div class="two"><button class="btn" id="exback">До завдань</button><button class="btn primary" id="exagain">Ще раз</button></div>`;
$("#exagain").onclick=()=>{SCREENS.exrun(XS.k);window.scrollTo(0,0)};$("#exback").onclick=()=>back()}

let RS=null;
const ttsText=s=>s.replace(/^[A-ZÆØÅ][\p{L}]+:\s*/gmu,"");
SCREENS.texts=()=>{view.innerHTML=`<h1 class="large">Читання й аудіювання</h1><p class="sub">Тексти як на PD3: читай або слухай і відповідай на питання</p><div class="list">`+
TEXTS.map((x,i)=>item(x.ic,x.t,x.ty+(S.readDone[i]!=null?` · ✓ ${S.readDone[i]}/${x.q.length}`:""),"text",i,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.text=i=>{const x=TEXTS[+i];RS={i:+i,mode:RS&&RS.i===+i?RS.mode:"read",ans:{},checked:false,tr:false,ord:x.q.map(q=>shuffle(q.o.map((_,j)=>j)))};showText()};
function showText(){const x=TEXTS[RS.i],L=RS.mode==="listen",show=!L||RS.checked;
view.innerHTML=`<h1 class="large">${esc(x.t)}</h1><p class="sub">${esc(x.ty)}</p>
<div class="seg" id="tmode"><button data-m="read" aria-pressed="${!L}">📖 Читати</button><button data-m="listen" aria-pressed="${L}">🎧 Слухати</button></div>
${L?`<div class="card2 c"><div class="cardbar">${spk2(ttsText(x.da),"big")}</div><p>${RS.checked?"Текст відкрито нижче.":"Послухай текст (можна кілька разів) і дай відповіді. Текст з’явиться після перевірки."}</p></div>`:""}
${show?`<div class="card2"><div class="txt">${esc(RS.tr?x.uk:x.da)}</div><p class="tbar">${L?"":spk2(ttsText(x.da))}<button class="link" id="trt">${RS.tr?"Показати данською":"Показати переклад"}</button></p></div>`:""}
<h2 class="h2">Питання</h2>${x.q.map((q,qi)=>`<div class="qq"><b>${qi+1}. ${esc(q.q)}</b><small>${esc(q.u)}</small><div class="opts">${RS.ord[qi].map(j=>{const sel=RS.ans[qi]===j,cls=RS.checked?(j===0?" right":sel?" wrong":""):"";return`<button class="btn${cls}" data-q="${qi}" data-j="${j}" aria-pressed="${sel}" ${RS.checked?"disabled":""}>${esc(q.o[j])}</button>`}).join("")}</div></div>`).join("")}
${RS.checked?`<div class="fb ${RS.score===x.q.length?"ok":"bad"}"><b>Результат: ${RS.score} з ${x.q.length}</b><p>${RS.score===x.q.length?"Усе правильно!":"Перечитай або переслухай текст і подивись, де відповідь."}</p></div><div class="two"><button class="btn" id="again2">Ще раз</button><button class="btn primary" id="nexttext">Наступний текст</button></div>`
:`<button class="btn primary wide" id="chk2" ${Object.keys(RS.ans).length<x.q.length?"disabled":""}>Перевірити відповіді</button>`}`;
$("#tmode").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;RS.mode=b.dataset.m;RS.tr=false;showText();if(RS.mode==="listen"&&!RS.checked)say(ttsText(x.da))};
const tr=$("#trt");if(tr)tr.onclick=()=>{RS.tr=!RS.tr;showText()};
view.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(RS.checked)return;RS.ans[+b.dataset.q]=+b.dataset.j;const y=window.scrollY;showText();window.scrollTo(0,y)});
const c=$("#chk2");if(c)c.onclick=()=>{RS.checked=true;RS.score=x.q.filter((_,qi)=>RS.ans[qi]===0).length;S.readDone[RS.i]=RS.score;bump("read");const y=window.scrollY;showText();window.scrollTo(0,y)};
const a=$("#again2");if(a)a.onclick=()=>{SCREENS.text(RS.i);window.scrollTo(0,0)};
const n=$("#nexttext");if(n)n.onclick=()=>{stack[stack.length-1]={r:"text",a:(RS.i+1)%TEXTS.length};render()}}

SCREENS.addw=pre=>{let pos="o";const tps=["Мої слова",...TOPICS.filter(t=>t!=="Мої слова")];
view.innerHTML=`<h1 class="large">Нове слово</h1><p class="sub">Слова з уроків, з роботи чи з життя</p>
<label class="fl">Данською<input id="fda" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="наприклад: bog"></label>
<div class="dk">${["æ","ø","å"].map(c=>`<button class="chip" data-ch="${c}">${c}</button>`).join("")}</div>
<label class="fl">Переклад українською<input id="fuk" class="inp" autocomplete="off" placeholder="наприклад: книга"></label>
<p class="fl">Частина мови</p><div class="seg" id="fpos">${[["en","Іменник en"],["et","Іменник et"],["v","Дієслово"],["o","Інше"]].map(([k,l])=>`<button data-p="${k}" aria-pressed="${k===pos}">${l}</button>`).join("")}</div>
<label class="fl">Тема<select id="ftp" class="inp">${tps.map(t=>`<option${t===(pre||"Мої слова")?" selected":""}>${esc(t)}</option>`).join("")}</select></label>
<div class="note" id="fmsg" hidden></div><button class="btn primary wide" id="fsave">Зберегти слово</button>`;
const da=$("#fda"),setPos=p=>{pos=p;view.querySelectorAll("#fpos [data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===p))};
$("#fpos").onclick=e=>{const b=e.target.closest("[data-p]");if(b)setPos(b.dataset.p)};
da.oninput=()=>{const v=da.value.trim().toLowerCase();if(/^en /.test(v))setPos("en");else if(/^et /.test(v))setPos("et");else if(/^at /.test(v))setPos("v")};
view.querySelectorAll("[data-ch]").forEach(c=>c.onclick=()=>{const s=da.selectionStart??da.value.length,e=da.selectionEnd??s;da.setRangeText(c.dataset.ch,s,e,"end");da.focus();da.oninput()});
$("#fsave").onclick=()=>{const m=$("#fmsg");let d=da.value.trim().replace(/\s+/g," "),uk=$("#fuk").value.trim(),t=$("#ftp").value;
if(!d||!uk){m.hidden=false;m.textContent="Заповни слово й переклад.";return}
d=d.replace(/^(en|et) /i,"");if(pos==="v"&&!/^at /i.test(d))d="at "+d;if(pos!=="v")d=d.replace(/^at (?=\S)/i,pos==="o"?"at ":"");
const dup=ALL.find(x=>x.da.toLowerCase()===d.toLowerCase());if(dup){m.hidden=false;m.innerHTML=`Таке слово вже є: <button class="link" data-go="word" data-a="${esc(dup.da)}">${esc(label(dup))} ›</button>`;return}
const w={da:d,uk,t,c:1,own:1};if(pos==="en"||pos==="et")w.art=pos;ALL.push(w);S.custom.push(w);if(!TOPICS.includes(t))TOPICS.unshift(t);save();
toast(`Додано: ${label(w)}`);stack.pop();const top=stack[stack.length-1];if(top.r==="topic"&&top.a===t)render();else go("topic",t)}};
function delWord(w){if(!confirm(`Видалити «${label(w)}»?`))return;const i=ALL.indexOf(w);if(i>=0)ALL.splice(i,1);S.custom=S.custom.filter(x=>x.da!==w.da);
delete S.box[w.da];delete S.due[w.da];delete S.det[w.da];delete S.ex[w.da];if(!ALL.some(x=>x.t===w.t)){const k=TOPICS.indexOf(w.t);if(k>=0&&w.t==="Мої слова")TOPICS.splice(k,1)}save();toast("Слово видалено");back()}

tile("pron","🔊","Вимова","Алфавіт і звуки","#ff2d55","#ff8fa3")+

SCREENS.words=()=>{view.innerHTML=`<h1 class="large">Слова</h1><p class="sub">Обери тему</p><div class="list">`+
item("➕","Додати своє слово","Слова з уроків чи з життя","addw","","#30d158")+
item("🗂️","Усі слова",`${ALL.length} слів`,"topic","","#8e8e93")+
TOPICS.map((t,i)=>{const L=inTopic(t);return item(TI[t]||"•",t,`${L.length} слів · вивчено ${L.filter(known).length}`,"topic",t,PAL[i%PAL.length])}).join("")+`</div>`};
SCREENS.topic=t=>{const L=inTopic(t);
view.innerHTML=`<h1 class="large">${esc(t||"Усі слова")}</h1><p class="sub">${L.length} слів · вивчено ${L.filter(known).length}</p><div class="two"><button class="btn primary" data-go="cards" data-a="${esc(t)}">Картки</button><button class="btn" data-go="quiz" data-a="${esc(t)}">Тест</button></div>`+
`<button class="btn wide" data-go="addw" data-a="${esc(t)}">➕ Додати своє слово</button>`+(t?`<button class="btn wide" id="gen">✨ Додати слова з ШІ</button><div class="note" id="gmsg" hidden></div>`:"")+
`<div class="list">`+L.map(w=>`<div class="wl${known(w)?" done":""}"><button class="wlb" data-go="word" data-a="${esc(w.da)}"><b>${esc(label(w))}</b><span>${esc(w.uk)}</span></button>${spk(label(w))}</div>`).join("")+`</div>`;
if(t)$("#gen").onclick=async()=>{const g=$("#gen"),m=$("#gmsg");g.disabled=true;m.hidden=false;m.textContent="Генерую слова…";
try{const have=L.map(label).join(", ");
const r=await askJson(`${INSTR}\nДай 12 нових данських слів рівня A2–B1 на тему «${t}», яких немає в цьому списку: ${have}. Для іменників став en або et. Поверни ЛИШЕ JSON-масив рядків у форматі "данське|переклад українською", наприклад ["en bil|автомобіль","at køre|їхати"].`);
let n=0;(Array.isArray(r)?r:[]).forEach(s=>{if(typeof s!=="string"||!s.includes("|"))return;const[d,uk]=s.split("|").map(x=>x.trim());const mm=d.match(/^(en|et) (.+)/),da=mm?mm[2]:d;if(!da||!uk||ALL.some(x=>x.da===da))return;const w=mm?{da,uk,art:mm[1],t,c:1}:{da,uk,t,c:1};ALL.push(w);S.custom.push(w);n++});
save();if(n)SCREENS.topic(t);else{m.textContent="Нових слів не знайшлося, спробуй ще раз.";g.disabled=false}}

let cd=null,flip=false,spoken=null;
const pickW=P=>{const pool=[];P.filter(w=>w!==cd).forEach(w=>{for(let i=0;i<5-(S.box[w.da]||0);i++)pool.push(w)});return rnd(pool.length?pool:P)};
SCREENS.cards=t=>{cd=null;flip=false;showCard(t||"")};
function showCard(t){const P=inTopic(t);if(!cd)cd=pickW(P);const w=cd,b=S.box[w.da]||0,ex=S.ex[w.da];
view.innerHTML=`<button class="card" id="card" aria-label="Перевернути картку">${flip?`<div class="uk">${esc(w.uk)}</div><div class="hint">${esc(w.t)}</div>`:`<div class="da">${esc(label(w))}</div><div class="hint">торкнись, щоб побачити переклад</div>`}</button>
<div class="cardbar">${spk2(label(w),"big")}<button class="chip" id="auto" aria-pressed="${!!S.auto}">Автоозвучення</button></div>
<div class="exbox">${flip?(ex?`<b>${esc(ex.da)}</b> ${spk(ex.da)}<br>${esc(ex.uk)}`:`<button class="link" id="exb">Показати приклад (ШІ)</button>`)+`<br><button class="link" data-go="word" data-a="${esc(w.da)}">Усі форми й приклади ›</button>`:""}</div>
<div class="two"><button class="btn again" id="again" ${flip?"":"disabled"}>Ще раз</button><button class="btn primary" id="know" ${flip?"":"disabled"}>Знаю</button></div>
<p class="sub c">Рівень слова: ${b}/4 · вивчено ${P.filter(known).length} з ${P.length}</p>`;
$("#card").onclick=()=>{flip=!flip;showCard(t)};
$("#auto").onclick=()=>{S.auto=!S.auto;save();$("#auto").setAttribute("aria-pressed",S.auto);if(S.auto)say(label(w))};
if(S.auto&&!flip&&spoken!==w){spoken=w;say(label(w))}
const next=up=>{grade(w,up);cd=null;flip=false;showCard(t)};
$("#again").onclick=()=>next(false);$("#know").onclick=()=>next(true);
const eb=$("#exb");if(eb)eb.onclick=async()=>{eb.textContent="Генерую…";eb.disabled=true;
try{const r=await askJson(`Склади одне коротке речення данською (рівень A2–B1) зі словом «${label(w)}» і дай його переклад українською. Поверни ЛИШЕ JSON {"da":"...","uk":"..."}`);
if(r&&r.da&&r.uk){S.ex[w.da]={da:String(r.da),uk:String(r.uk)};save()}else throw{message:"Не вдалося отримати приклад."}}
catch(e){eb.textContent=aiErr(e);return}
if(cd===w)showCard(t)}}

// ---------- ТЕСТ ----------
let qm="tr",qq=null,qa=false;
SCREENS.quiz=t=>{qq=null;qa=false;showQuiz(t||"")};
function newQ(P){const nouns=P.filter(w=>w.art);
if(qm==="art"&&nouns.length>1){const w=rnd(nouns);return{w,text:`${w.da} (${w.uk})`,opts:["en","et"],ans:w.art}}
const w=rnd(P),oth=shuffle(P.filter(x=>x!==w&&x.uk!==w.uk)).slice(0,3);
if(qm==="rev")return{w,text:w.uk,opts:shuffle([w,...oth]).map(label),ans:label(w)};
return{w,text:label(w),opts:shuffle([w,...oth]).map(x=>x.uk),ans:w.uk}}
function showQuiz(t){const P=inTopic(t);if(qm==="art"&&P.filter(w=>w.art).length<2){qm="tr";qq=null}if(!qq)qq=newQ(P);
const M=[["tr","Данська → укр"],["rev","Укр → данська"],["aud","На слух"]];if(P.filter(w=>w.art).length>1)M.push(["art","en чи et"]);
view.innerHTML=`<div class="mode">${M.map(m=>`<button class="chip" data-m="${m[0]}" aria-pressed="${qm===m[0]}">${m[1]}</button>`).join("")}</div>
${qm==="aud"?`<div class="qaud">${spk2(label(qq.w),"big")}<span id="qw" class="${qa?"":"hid"}">${qa?esc(label(qq.w)):"Послухай і обери переклад"}</span></div>`:`<div class="q">${esc(qq.text)}</div>`}<div class="opts">${qq.opts.map(o=>`<button class="btn" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
<button class="btn primary wide" id="nx" ${qa?"":"disabled"}>Далі</button><p class="sub c" id="sc">${esc(t||"Усі слова")} · правильно ${S.right} з ${S.total}</p>`;
view.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{qm=c.dataset.m;qq=null;qa=false;showQuiz(t)});
view.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{if(qa)return;qa=true;S.total++;
const ok=b.dataset.o===qq.ans;if(ok)S.right++;grade(qq.w,ok);
view.querySelectorAll(".opts .btn").forEach(y=>{if(y.dataset.o===qq.ans)y.classList.add("right");else if(y===b)y.classList.add("wrong")});
if(qm==="aud"){const qw=$("#qw");qw.textContent=label(qq.w);qw.className=""}else say(label(qq.w));
$("#nx").disabled=false;$("#sc").textContent=`${t||"Усі слова"} · правильно ${S.right} з ${S.total}`});
$("#nx").onclick=()=>{qq=null;qa=false;showQuiz(t)};
if(qm==="aud"&&!qa)say(label(qq.w))}

// ---------- ГРАМАТИКА ----------
SCREENS.grammar=()=>{view.innerHTML=`<h1 class="large">Граматика</h1><p class="sub">Частини мови</p><div class="list">`+GR.map((g,i)=>item(g.ic,g.t,`${g.items.length} правил з прикладами`,"gsec",i,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.gsec=i=>{const g=GR[+i];view.innerHTML=`<h1 class="large">${esc(g.t)}</h1>`+g.items.map(r=>`<section class="card2"><h3>${esc(r.t)}</h3><p>${hl(r.p)}</p>${r.ex.map(e=>{const[d,u]=e.split("|");return`<div class="ex"><div><b>${hl(d)}</b><span>${esc(u)}</span></div>${spk(d)}</div>`}).join("")}</section>`).join("")};

// ---------- ПИСЬМО ----------
const drafts={};
SCREENS.write=()=>{view.innerHTML=`<h1 class="large">Письмо</h1><p class="sub">Обери тип тексту</p><div class="list">`+WR.map((w,i)=>item(["📧","💌","💭","📣","💼","💡"][i]||"📝",w.t,w.task.split(". ")[0].slice(0,60)+"…","wtask",i,PAL[i%PAL.length])).join("")+`</div>`};
SCREENS.wtask=i=>{const w=WR[+i];
view.innerHTML=`<h1 class="large">${esc(w.t)}</h1><div class="note"><b>Завдання.</b> ${esc(w.task)}</div>
<details><summary>Приклад відповіді</summary><div class="pre">${esc(w.text)}</div><button class="link" data-say="${esc(w.text)}">Прослухати текст</button> · <button class="link" id="trb">Показати переклад (ШІ)</button><div class="pre" id="trout"></div><p>${esc(w.tips)}</p></details>
<details><summary>Корисні фрази</summary><div class="pre">${esc(PHR)}</div></details>
<textarea id="tx" rows="9" placeholder="Напиши свій текст данською…"></textarea>
<button class="btn primary wide" id="chk">Перевірити з ШІ</button><div class="pre out" id="out"></div>`;
const tx=$("#tx");tx.value=drafts[i]||"";tx.oninput=()=>drafts[i]=tx.value;
$("#trb").onclick=async()=>{const o=$("#trout");o.textContent="Перекладаю…";try{await ask(`Переклади українською, без коментарів:\n\n${w.text}`,x=>o.textContent=x)}catch(e){o.textContent=aiErr(e)}};
$("#chk").onclick=async()=>{const t=tx.value.trim(),o=$("#out"),b=$("#chk");if(t.length<20){o.textContent="Спочатку напиши текст.";return}
o.textContent="Перевіряю…";b.disabled=true;
try{await ask(INSTR+`\n\nЗавдання: ${w.task}\n\nТекст студента:\n${t}\n\nЗроби: 1) коротка оцінка; 2) помилки у форматі «фрагмент → виправлення → пояснення»; 3) виправлена версія данською; 4) дві поради для тесту.`,x=>o.textContent=x)}catch(e){o.textContent=aiErr(e)}
b.disabled=false}};

// ---------- ШІ-ТРЕНЕР ----------
let chat=[];
function drawLog(){const L=$("#log");if(!L)return;L.replaceChildren(...chat.map(m=>{const d=document.createElement("div");d.className="msg "+m.role;d.textContent=m.content;return d}))}
async function send(txt){if(!txt.trim()||chat.length&&chat[chat.length-1].content==="…")return;chat.push({role:"user",content:txt},{role:"assistant",content:"…"});drawLog();
const msgs=chat.slice(0,-1).map((m,i)=>i?m:{role:"user",content:INSTR+"\n\n"+m.content});
try{await ask(msgs,x=>{chat[chat.length-1].content=x;drawLog()})}catch(e){chat[chat.length-1].content=aiErr(e)}drawLog()}
SCREENS.ai=()=>{const P=[["Розмова: подорожі","Давай розмовляти данською про подорожі. Став мені питання по одному й виправляй мої помилки."],["Вправа на переклад","Дай 5 речень українською для перекладу данською на тему роботи, потім перевір мої відповіді."],["Пояснити правило","Поясни простою мовою, де в данській ставити ikke: до дієслова чи після."],["Підготовка до усної частини","Проведи зі мною коротке інтерв’ю данською, як на усній частині тесту, і дай відгук."]];
view.innerHTML=`<h1 class="large">ШІ-тренер</h1><div class="mode">${P.map((p,i)=>`<button class="chip" data-p="${i}">${p[0]}</button>`).join("")}</div><div id="log"></div><textarea id="in" rows="3" placeholder="Напиши повідомлення…"></textarea><button class="btn primary wide" id="send">Надіслати</button>`;
view.querySelectorAll("[data-p]").forEach(c=>c.onclick=()=>send(P[+c.dataset.p][1]));
$("#send").onclick=()=>{const v=$("#in").value;$("#in").value="";send(v)};drawLog()};

if(API&&"serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
render();
</script>
</body>
</html>
